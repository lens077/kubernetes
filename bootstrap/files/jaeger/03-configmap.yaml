# Jaeger v2 主配置。
#
# 与迁移前(ES 后端)逐字对齐:receivers / processors / service.pipelines /
# service.telemetry 四段完全未改动,只把 extensions.jaeger_storage 的
# primary_store 从 elasticsearch 换成 badger。
#
# 注意:不再由 Helm 管理后,改这个 ConfigMap 不会自动重启 Pod,
# 需要手动 kubectl rollout restart deployment/jaeger -n observability
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/component: all-in-one
data:
  user-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      zipkin:
        endpoint: 0.0.0.0:9411

    processors:
      batch: {}

    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133

      jaeger_storage:
        backends:
          primary_store:
            badger:
              # ephemeral: false 才会真正落到下面的 directories,
              # 设成 true 时 badger 会忽略 directories 改用临时目录。
              ephemeral: false
              directories:
                keys: /badger/keys
                values: /badger/values
              # 对齐原 esIndexCleaner 的 numberOfDays: 7。
              # badger 用 TTL 自动过期,不再需要额外的清理 CronJob。
              ttl:
                spans: 168h

      jaeger_query:
        storage:
          traces: primary_store

    exporters:
      jaeger_storage_exporter:
        trace_storage: primary_store

    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
