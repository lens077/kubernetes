# Umami: 三个值的真相源在 OpenBao secret/k8s/${CLUSTER_NAME}/umami
#   app-secret        会话/JWT 签名密钥。换掉会让所有登录态失效(可接受, 非数据)。
#   two-factor-key    2FA 种子的加密密钥。**换掉会让已绑定的 2FA 全部失效且无法恢复**。
#   database-url      整串 DSN。密码不单独拆开——URL 编码只在写入时做一次, 避免两处各做一遍。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-secret
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: umami-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        APP_SECRET: "{{ .appSecret }}"
        TWO_FACTOR_ENCRYPTION_KEY: "{{ .twoFactorKey }}"
        DATABASE_URL: "{{ .databaseUrl }}"
  data:
    - secretKey: appSecret
      remoteRef: { key: k8s/${CLUSTER_NAME}/umami, property: app-secret }
    - secretKey: twoFactorKey
      remoteRef: { key: k8s/${CLUSTER_NAME}/umami, property: two-factor-key }
    - secretKey: databaseUrl
      remoteRef: { key: k8s/${CLUSTER_NAME}/umami, property: database-url }
