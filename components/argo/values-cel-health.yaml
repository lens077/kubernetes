# ArgoCD custom health checks for Kyverno 1.20 CEL policies.
# Merge into the Helm values used for release `argocd` (ns: argocd).
# The script keys are explicit because ArgoCD 3.6 has no built-in health
# checker for policies.kyverno.io/* kinds.
configs:
  cm:
    resource.customizations.health.policies.kyverno.io_ValidatingPolicy: |
      hs = {}
      if obj.status ~= nil then
        local cs = obj.status.conditionStatus
        local ready = nil
        local conditions = nil
        if cs ~= nil then
          ready = cs.ready
          conditions = cs.conditions
        end
        if ready == nil then ready = obj.status.ready end
        if conditions == nil then conditions = obj.status.conditions end
        if ready == true or ready == "True" then
          hs.status = "Healthy"
          hs.message = "Kyverno CEL policy is ready"
          if conditions ~= nil then
            local msgs = {}
            for _, c in ipairs(conditions) do
              if c.status == "True" and c.message ~= nil and c.message ~= "" then
                table.insert(msgs, c.message)
              end
            end
            if #msgs > 0 then hs.message = table.concat(msgs, "; ") end
          end
          return hs
        end
        if ready == false or ready == "False" then
          hs.status = "Degraded"
          hs.message = "Kyverno CEL policy is not ready"
          if conditions ~= nil then
            for _, c in ipairs(conditions) do
              if (c.status == "False" or c.status == false) and c.message ~= nil and c.message ~= "" then
                hs.message = c.message
                return hs
              end
            end
          end
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Kyverno CEL policy to become ready"
      return hs
