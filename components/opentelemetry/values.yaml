# 静态部分。exporters 与 service.pipelines 由 install.sh 按"集群里实际装了哪些后端"
# 动态生成后追加（多一个 -f），因此这里不写死任何后端地址。
mode: deployment
image:
  repository: "otel/opentelemetry-collector-contrib"

presets:
  clusterMetrics:
    enabled: true                # k8s_cluster：节点、Pod、Deployment 的状态指标
  kubernetesEvents:
    enabled: true                # k8sobjects watch：Kubernetes Event 进入 logs pipeline
    useK8sEventsReceiver: false  # 0.158.0 继续使用已验证的 k8sobjects receiver
  logsCollection:
    enabled: false               # 容器日志由 Vector 采集，开了会重复写入

# 公网(remote-dev)OTLP 入口 2026-09-23: 第二个 http receiver otlp/public(:4319)挂 bearertokenauth,
# 只有它经 HTTPRoute otlp.dev.test → Pangolin otlp-dev.apikv.com 暴露; 集群内 4317/4318 保持匿名,
# 鉴权边界只在公网入口。token 由 install.sh 经 get_cred otlp-public-token 生成 → Secret otlp-public-auth,
# 以 env 注入(collector 支持 ${env:...} 展开)。Mac 侧放 ~/.config/apikv/otel.mk:
#   export OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer%20<token>   (空格必须写 %20)
extraEnvs:
  - name: OTLP_PUBLIC_TOKEN
    valueFrom:
      secretKeyRef:
        name: otlp-public-auth
        key: token
ports:
  otlp-public:
    enabled: true
    containerPort: 4319
    servicePort: 4319
    protocol: TCP

config:
  extensions:
    bearertokenauth/public:
      scheme: Bearer
      token: ${env:OTLP_PUBLIC_TOKEN}
  processors:
    delta_to_cumulative:         # 新组件名；旧别名 deltatocumulative 每次启动都刷 deprecation warn
      max_stale: 5m
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    otlp/public:
      protocols:
        http:
          endpoint: 0.0.0.0:4319
          auth:
            authenticator: bearertokenauth/public
    # 只发现 Cilium agent/operator、Hubble metrics 与 Vector security exporter。
    # chart 自带的 prometheus receiver 继续抓 Collector 自身 :8888。
    prometheus/cilium:
      config:
        scrape_configs:
          - job_name: cilium-agent
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                action: keep
                regex: cilium
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: prometheus
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          - job_name: cilium-operator
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_name]
                action: keep
                regex: cilium-operator
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: prometheus
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          - job_name: hubble
            scrape_interval: 15s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                action: keep
                regex: cilium
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: hubble-metrics
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          # ---- 2026-09-03 新增: 数据库与告警链路自身的指标(vmalert 的 cnpg.yml / observability-pipeline.yml 靠它们) ----
          # CNPG 实例 Pod 自带 exporter(:9187, 端口名 metrics): cnpg_collector_* / cnpg_pg_* / cnpg_backends_*
          - job_name: cnpg
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [postgresql]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
                action: keep
                regex: instance
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: metrics
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                target_label: cnpg_cluster      # 不用 cluster: 那是 k8s 集群名(ces-audit 规则在用)
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          # CNPG Pooler(pgbouncer) Pod, 端口名同样是 metrics(:9127): cnpg_pgbouncer_*
          - job_name: cnpg-pooler
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [postgresql]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
                action: keep
                regex: pooler
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: metrics
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
                target_label: pooler
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          # vmalert(:8880) 与 Alertmanager(:9093)自身指标: 告警链路坏了靠它们告警
          - job_name: vmalert
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [observability]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: vmalert;victoria-metrics-alert
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_ip]
                target_label: __address__
                replacement: $1:8880
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          - job_name: alertmanager
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [observability]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: alertmanager
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_ip]
                target_label: __address__
                replacement: $1:9093
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          # gatus(:8080/metrics): 合成探测结果(gatus_results_*)也进 VM, 面板与规则都能用
          - job_name: gatus
            scrape_interval: 60s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [ops]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: gatus
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_ip]
                target_label: __address__
                replacement: $1:8080
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod

    prometheus/kafka:
      config:
        scrape_configs:
          - job_name: kafka-exporter
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kafka]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: kafka-exporter
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_ip]
                target_label: __address__
                replacement: $1:9404
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          # Strimzi 注入的 JMX exporter(broker 与 Connect 的 :9404, 端口名 tcp-prometheus)。
          # 2026-09-23 前只抓 kafka-exporter, broker/Connect 的 metricsConfig 开了却没人来抓。
          # Connect 侧给出 kafka_connect_connector_task_status 与 debezium_metrics_*(规则见 kafka/cdc/connect-metrics-configmap.yaml)。
          - job_name: strimzi-jmx
            scrape_interval: 30s
            scrape_timeout: 10s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kafka]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
                action: keep
                regex: Kafka|KafkaConnect
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: tcp-prometheus
              - source_labels: [__meta_kubernetes_pod_phase]
                action: keep
                regex: Running
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
                target_label: strimzi_kind

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
