# 静态部分。exporters 与 service.pipelines 由 install.sh 按"集群里实际装了哪些后端"
# 动态生成后追加（多一个 -f），因此这里不写死任何后端地址。
mode: deployment
image:
  repository: "otel/opentelemetry-collector-contrib"

presets:
  clusterMetrics:
    enabled: true                # k8s_cluster receiver：节点/Pod/Deployment 的状态指标
  logsCollection:
    enabled: false               # 容器日志由集群里已有的 fluent-bit 采集，开了会双份

config:
  processors:
    delta_to_cumulative:         # 新组件名；旧别名 deltatocumulative 每次启动都刷 deprecation warn
      max_stale: 5m
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
