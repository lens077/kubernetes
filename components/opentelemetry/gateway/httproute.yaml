# 公网 OTLP 写入口: 只挂 https 段、只指 :4319(带 bearertokenauth 的 otlp/public receiver)。
# 不要把它改指 4318——那是匿名的集群内 receiver, 改了就是公网任人灌数据。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${RELEASE}-public
  namespace: ${NAMESPACE}
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "${HOSTNAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - name: otel-opentelemetry-collector
          port: 4319
