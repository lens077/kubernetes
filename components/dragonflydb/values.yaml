replicaCount: 1

# 对齐 Dragonfly 官方 Helm 示例与 Kubernetes Restricted Pod Security：
# 进程不需要 root、Linux capabilities 或可写根文件系统。
podSecurityContext:
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP                # 对外走 Gateway 的 TCPRoute，不再各占一个 LB IP
  port: 6379

# 缓存语义：上限内存 + 满时淘汰（等价 redis maxmemory + allkeys-lru）
#
# ⚠️ proactor_threads 必须显式钉死：Dragonfly 启动时校验
#    maxmemory >= 256MiB × io 线程数，不指定就按节点 CPU 核数起线程
#    （4 核 => 要 1GiB），256mb 会直接 "Exiting..." 崩溃循环。
extraArgs:
  - --maxmemory=${DRAGONFLY_MAXMEMORY}
  - --proactor_threads=${DRAGONFLY_PROACTOR_THREADS}
  - --cache_mode=true

passwordFromSecret:
  enable: true
  existingSecret:
    name: dragonfly-password-secret
    key: password

serviceMonitor:
  enabled: false                 # 集群里用的是 VictoriaMetrics + OTel，不是 Prometheus Operator

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # 原部署 limits.cpu=100m 会造成缓存限流抖动，特意只限内存不限 CPU
  limits:
    memory: 512Mi

# 原生 TLS(2026-08-20, 与 redis 组件同构): 证书由 cert-manager global-ca-issuer 签
# (certificate.yaml), 6379 单口直接 TLS —— 客户端连 rediss://dragonfly.dragonfly.svc:6379,
# 与此前 redis.redis.svc:6379 仅 host 不同。历史注: 旧集群曾出现"客户端配了 TLS 而服务端
# 没开"的死路(cart pre.yml 注释可考), 本次让它成真。
tls:
  enabled: true
  createCerts: false             # 证书自管(SAN 要含 svc 域名), 不用 chart 的 cert-manager 集成
  existing_secret: dragonfly-tls
