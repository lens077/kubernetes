# Dragonfly 密码: 真相源 OpenBao/Vault(${ESO_STORE}) 的 k8s/${CLUSTER_NAME}/dragonfly(键 password),
# ESO 物化成 Secret dragonfly-password-secret —— chart 的 passwordFromSecret 同名同键, values 零改动。
# 集群重装后凭据自动流回; get_cred 的随机值只是 OFFLINE 降级路径(见 _lib/env.sh cred_via_eso)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-password-secret
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h            # 静态密钥分级约定(external-secrets 组件 examples)
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: dragonfly-password-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: k8s/${CLUSTER_NAME}/dragonfly
        property: password
