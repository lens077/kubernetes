# Dragonfly 原生 TLS 走 TCPRoute: 流量本身就是 TLS(dragonfly 进程终结), 网关只做 L4 转发。
# 外部端口用 Redis 惯例的 6380(提醒客户端"这里必须 --tls"), 后端仍是 svc 的 6379 TLS 单口
# —— 与 redis 组件同构; 旧的明文 6379 listener 一并替换(修掉历史上 TLS 半配的死路)。
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dragonfly-gateway
  namespace: ${NAMESPACE}
spec:
  gatewayClassName: cilium
  listeners:
    - name: redis-tls
      port: 6380
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: dragonfly
  namespace: ${NAMESPACE}
spec:
  parentRefs:
    - name: dragonfly-gateway
      sectionName: redis-tls
  rules:
    - backendRefs:
        - name: dragonfly
          port: 6379
