# Spegel —— 2026-08-20 选型定稿 §9(试装): 节点间 P2P 镜像缓存
# 前提已核查: 两节点 containerd 2.3 的 config_path=/etc/containerd/certs.d ✓
# ✅ 2026-08-20 实测: containerd 2.3.4 + use_local_image_pull=false 下 mirror 正常命中
#   (node1 首拉 8.8s → node2 102ms, hit 计数器实证), 无需改节点; 详见 README
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 128Mi }

# v0.7.4 中这个布尔值会省略 registry hostPort，并让 NodePort Service 优先本节点端点。
# 不要额外写 hostPort: 0；单独使用 0 可能生成无效的 :0 mirror target。
service:
  registry:
    usePreferSameNodeTrafficDistribution: true

spegel:
  containerdRegistryConfigPath: /etc/containerd/certs.d
  # 不让 Spegel 接管 certs.d: 它会把全部 hosts.toml 挪进 _backup/、只留指向 P2P 的 _default，
  # 未命中就"上游直连"——机房 docker.io/registry.k8s.io/quay.io 直连不通(2026-09-06 实测 80 阶段
  # 大面积 ImagePullBackOff)。certs.d 由 bootstrap 40 阶段独占: 每个 hosts.toml 先本节点 Spegel、
  # 再国内镜像站、最后回源(config.env: SPEGEL_MIRROR_PORT)。
  containerdMirrorAdd: false
  # 标签仍由上游解析，Spegel 只按 digest 命中本地缓存，避免冷镜像被误报为 NotFound。
  resolveTags: false
