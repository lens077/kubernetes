# 集群自签根证书。私钥与证书存在 cert-manager 命名空间的 global-root-ca-secret，
# 由 03 的 ClusterIssuer 消费。
#
# 客户端信任这套证书（浏览器/curl 不再报警告）：
#   kubectl -n cert-manager get secret global-root-ca-secret \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > global-root-ca.crt
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: global-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: my-global-root-ca
  secretName: global-root-ca-secret
  duration: 87600h              # 10 年：内网根证书，换一次要重新分发信任链
  privateKey:
    algorithm: ECDSA            # 内网网关场景比 RSA 更轻
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
