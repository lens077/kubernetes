# pg-main 的默认宿主网入口：TLS passthrough + SNI 分流。
# postgres/install.sh 在 pg-main-rw 就绪后通过 routes_apply 自动应用本清单。
# 网关不解密；客户端必须使用 pg.dev.test、verify-full 和 direct TLS negotiation。
# 传统 PostgreSQL SSLRequest 客户端改用 examples/pg-tcproute.yaml 兼容入口。
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pg-passthrough-gateway
  namespace: postgresql
spec:
  gatewayClassName: cilium
  # 不写 addresses: IP 由 Cilium 从 LB 池自动分配, kubectl get gateway -o wide 查看
  listeners:
    - name: pg
      port: 5432
      protocol: TLS        # 必须是 TLS,不是 TCP/HTTPS
      tls:
        mode: Passthrough  # 网关不解密,原样透传给 PostgreSQL
      allowedRoutes:
        kinds:
          - kind: TLSRoute
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1   # ⚠️ 必须 v1: 本集群 CRD 只 served v1
kind: TLSRoute
metadata:
  name: pg-main
  namespace: postgresql
spec:
  parentRefs:
    - name: pg-passthrough-gateway
      sectionName: pg
  hostnames:
    - "pg.dev.test"          # SNI 域名;再加实例就再加一条 TLSRoute 换 hostname
  rules:
    - backendRefs:
        - name: pg-main-rw   # CNPG 生成的读写 Service
          port: 5432
