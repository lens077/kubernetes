# 采集器只需要「读 /metrics」这一个非资源权限。
# 不用 cluster-admin / system:masters：那会让一个跑在 hostNetwork 里的采集器
# 拿到整个集群的写权限，与其职责严重不匹配。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-metrics
  namespace: observability
  labels:
    app: control-plane-metrics
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-metrics-scraper
  labels:
    app: control-plane-metrics
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane-metrics-scraper
  labels:
    app: control-plane-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-metrics-scraper
subjects:
  - kind: ServiceAccount
    name: control-plane-metrics
    namespace: observability
