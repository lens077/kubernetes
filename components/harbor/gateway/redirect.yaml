apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${RELEASE}-redirect
  namespace: ${NAMESPACE}
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: http
  hostnames:
    - "${HOSTNAME}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
