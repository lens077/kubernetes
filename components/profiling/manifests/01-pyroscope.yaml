# Pyroscope v2 单节点(server 端)。镜像按 digest 固定, 避免 :latest 且保证可复现。
# 存储: 单块 PVC(openebs-lvm), v2 的 object store 用 filesystem 后端, metastore 与 raft 同盘持久化。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyroscope
  labels:
    app: pyroscope
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  labels:
    app: pyroscope
spec:
  type: ClusterIP
  selector:
    app: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyroscope
  labels:
    app: pyroscope
spec:
  serviceName: pyroscope
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      serviceAccountName: pyroscope
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: pyroscope
          image: docker.io/grafana/pyroscope@sha256:288da0b9b73193b5aee0843b6f1f5d033ee697d4afa280efb95de338d1409870
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/pyroscope/config.yaml
            - -config.expand-env=true
            - -config.show_banner=false
            - -server.http-listen-address=0.0.0.0
            - -server.http-listen-port=4040
            - -auth.multitenancy-enabled=false
            - -architecture.storage=v2
            - -storage.backend=filesystem
            - -storage.filesystem.dir=/data/v2/shared
            - -metastore.data-dir=/data/v2/metastore/data
            - -metastore.raft.dir=/data/v2/metastore/raft
            - -metastore.raft.snapshots-dir=/data/v2/metastore/raft/snapshots
            - -retention-period=168h
            - -metastore.min-ready-duration=0
            - -segment-writer.min-ready-duration=0
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: openebs-lvm
        resources:
          requests:
            storage: 20Gi
