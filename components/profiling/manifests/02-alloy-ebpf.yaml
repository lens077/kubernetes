# Grafana Alloy: pyroscope.ebpf 无侵入采集所有 namespace 的容器 CPU 栈(含 Go runtime 函数)。
# 每个节点一个 DaemonSet; 必须 root + hostPID 才能读 /proc 与加载 eBPF。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-pyroscope
  labels:
    app: alloy-pyroscope
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-pyroscope-discovery
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-pyroscope-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-pyroscope-discovery
subjects:
  - kind: ServiceAccount
    name: alloy-pyroscope
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-pyroscope-config
data:
  config.alloy: |
    // 只发现本节点上的 Pod; NODE_NAME 由 downward API 注入(比 HOSTNAME 可靠)。
    discovery.kubernetes "all_pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "local_pods" {
      targets = discovery.kubernetes.all_pods.targets

      rule {
        action        = "drop"
        regex         = "Succeeded|Failed"
        source_labels = ["__meta_kubernetes_pod_phase"]
      }

      // 服务名: ebpf/<namespace>/<container>, 例如 ebpf/ecommerce/order-api。
      rule {
        action        = "replace"
        regex         = "(.*)@(.*)"
        replacement   = "ebpf/${1}/${2}"
        separator     = "@"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        target_label  = "service_name"
      }

      rule {
        action = "labelmap"
        regex  = "__meta_kubernetes_pod_label_(.+)"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    pyroscope.ebpf "local_pods" {
      targets          = discovery.relabel.local_pods.output
      forward_to       = [pyroscope.write.endpoint.receiver]
      collect_interval = "15s"
      sample_rate      = 19
    }

    pyroscope.write "endpoint" {
      endpoint {
        url = "http://pyroscope.observability.svc.cluster.local:4040"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-pyroscope
  labels:
    app: alloy-pyroscope
spec:
  selector:
    matchLabels:
      app: alloy-pyroscope
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alloy-pyroscope
    spec:
      serviceAccountName: alloy-pyroscope
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: alloy
          image: docker.io/grafana/alloy@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            - name: symb-cache
              mountPath: /tmp/symb-cache
            - name: bpffs
              mountPath: /sys/fs/bpf
      volumes:
        - name: config
          configMap:
            name: alloy-pyroscope-config
        - name: symb-cache
          emptyDir: {}
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
