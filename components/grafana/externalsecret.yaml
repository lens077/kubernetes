# Grafana admin 口令: 真相源 OpenBao/Vault k8s/${CLUSTER_NAME}/grafana(键 admin-password),
# ESO 物化成 Secret grafana-admin, chart 用 admin.existingSecret 引用(values.yaml)。
# ⚠️ Grafana 只在首次初始化时读这个口令, 之后存自己的库; 改 OpenBao 不等于换密码——
#    要轮换用 grafana-cli admin reset-admin-password(README §6)。所以这份是「原值迁移」, 不轮换。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: { key: k8s/${CLUSTER_NAME}/grafana, property: admin-user }
    - secretKey: admin-password
      remoteRef: { key: k8s/${CLUSTER_NAME}/grafana, property: admin-password }
