# Alertmanager 负责聚合/抑制，bridge 持久化 page/ticket 指数退避。
# 5m repeat 是向桥的刷新周期，不是手机推送周期；必须先部署带持久状态的新桥。
baseURL: https://${HOSTNAME}

persistence:
  enabled: true
  storageClass: ${SC_NAME}
  size: ${ALERTMANAGER_STORAGE_SIZE}   # nflog + silences, 很小

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

service:
  type: ClusterIP
  port: 9093

config:
  enabled: true
  global:
    resolve_timeout: 5m
  templates:
    - '/etc/alertmanager/*.tmpl'
  route:
    receiver: alert-bridge
    group_by: ['alertname', 'cluster', 'k8s_namespace_name', 'service_name', 'deployment_environment_name', 'severity']
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 5m
    routes:
      # Watchdog 只证明评估到 AM，消失检测由 Gatus 独立探针负责；不推手机。
      - matchers: ['alertname="Watchdog"']
        receiver: 'null'
        repeat_interval: 4h
  receivers:
    - name: 'null'
    - name: alert-bridge
      webhook_configs:
        - url: http://alert-bridge.observability.svc.cluster.local:9099/alerts
          send_resolved: true
          max_alerts: 0             # 保留完整成员供持久episode恢复；桥负责限制手机正文大小
  inhibit_rules:
    # 只有具备相同非空故障域标签时才抑制，不猜测 Pod 到 Node 的归属。
    - source_matchers: ['alertname="K8sNodeNotReady"', 'cluster!=""', 'k8s_node_name!=""']
      target_matchers: ['category="kubernetes"', 'cluster!=""', 'k8s_node_name!=""']
      equal: ['cluster', 'k8s_node_name']
    # 仅抑制依赖同一集群对象采集器的规则，独立黑盒探针不受影响。
    - source_matchers: ['alertname="K8sClusterMetricsMissing"', 'cluster!=""']
      target_matchers: ['alertname=~"K8sPodRestartStorm|K8sContainerNotReady|K8sDeploymentDegraded|K8sDeploymentUnavailable|K8sFailedPodsAccumulating|K8sNodeNotReady|VectorDaemonSetReadyBelowExpected|OTelClusterCollectorReadyBelowExpected"', 'cluster!=""']
      equal: ['cluster']
