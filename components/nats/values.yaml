# NATS JetStream —— 2026-08-20 选型定稿 §1（TECH-RADAR 1.2）
# 3 副本 meta-R3；2 节点期用软反亲和（第 3 节点加入后自动摊开）
config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        size: 2Gi
        storageClassName: ${SC_NAME}
  leafnodes: { enabled: false }
  websocket: { enabled: false }
  mqtt: { enabled: false }
  monitor: { enabled: true }

container:
  merge:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 384Mi }

podTemplate:
  merge:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: nats }

promExporter:
  enabled: true
  podMonitor: { enabled: false }

natsBox:
  enabled: true
