# 集群级 SecretStore:指向线上 Vault(docker-deploy 仓 vault/,https://vault.apikv.com)
#
# 认证走 AppRole,是反向可达性决定的:kubernetes auth 需要 Vault 回连本集群 apiserver
# 验证 token,而集群在 LAN 里、公网 Vault 够不着;AppRole 纯出站。
# role-id/secret-id 都从 Secret vault-approle 引用(install.sh 从环境变量创建,不入 Git)。
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.apikv.com   # 公共可信证书(acme.sh 泛证书),无需 caProvider
      path: secret                      # KV v2 挂载点
      version: v2
      auth:
        appRole:
          path: approle
          roleRef:
            name: vault-approle
            key: role-id
            namespace: external-secrets   # cluster 级资源必须显式写 ns
          secretRef:
            name: vault-approle
            key: secret-id
            namespace: external-secrets
