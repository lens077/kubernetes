# 模板(冒烟用,验证完即删,勿长期部署):把 Vault 的 secret/demo 物化成 k8s Secret demo-hello
# 验证: kubectl -n external-secrets get secret demo-hello -o jsonpath='{.data.hello}' | base64 -d
# ⚠ refreshInterval 分级约定(2026-08-17 性能审查):静态密钥默认 1h;要立即生效用 force-sync
#   注解或临时调小;别抄 1m —— 无 reloader 时 Pod 吃不到快传播,纯属空转公网轮询
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-hello
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: demo-hello           # 物化出的 k8s Secret 名
  dataFrom:
    - extract:
        key: demo              # 即 secret/data/demo,取全部字段
