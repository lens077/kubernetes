# 冒烟:把 Vault 的 secret/demo 物化成 k8s Secret demo-hello
# 验证: kubectl -n external-secrets get secret demo-hello -o jsonpath='{.data.hello}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-hello
  namespace: external-secrets
spec:
  refreshInterval: 1m          # Vault 侧改值后最多 1 分钟传播到集群
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: demo-hello           # 物化出的 k8s Secret 名
  dataFrom:
    - extract:
        key: demo              # 即 secret/data/demo,取全部字段
