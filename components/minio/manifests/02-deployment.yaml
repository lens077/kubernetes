# 单实例对象存储。镜像使用 pgsty/silo：保留完整 Web Console 的 MinIO 兼容分支。
# 固定到已验证的发布版本；Silo 不支持进程内自更新，升级时改 tag 并重跑 install.sh。
#
# 镜像里的二进制名是 silo，不是 minio；环境变量仍兼容 MINIO_*。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  selector:
    matchLabels: {app: minio}
  strategy:
    type: Recreate            # 单副本 + RWO 卷：滚动更新会因为卷被占用而卡住
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ":9090"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio-root, key: user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio-root, key: password}
            # Console 登录后的跳转必须使用公网地址；否则反向代理场景会生成集群内地址。
            - {name: MINIO_BROWSER_REDIRECT_URL, value: "https://silo.apikv.com"}
            # S3 presigned URL 等对外地址使用独立 API 域名。
            - {name: MINIO_SERVER_URL, value: "https://silo-api.apikv.com"}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9090, name: console}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
