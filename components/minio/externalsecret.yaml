# minio root 凭据:真相源在线上 Vault(secret/k8s/minio),ESO 物化成 Secret minio-root。
# Deployment 的 secretKeyRef {name: minio-root, key: user/password} 原样不动 —— 同名同键替换。
# 集群重装后凭据自动流回,不再依赖节点本地 STATE_DIR 的 get_cred 随机值(那是降级路径)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root
  namespace: minio
spec:
  refreshInterval: 1h            # 静态密钥分级约定:默认 1h(见 external-secrets 组件 examples)
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: minio-root
  data:
    - secretKey: user
      remoteRef:
        key: k8s/minio
        property: user
    - secretKey: password
      remoteRef:
        key: k8s/minio
        property: password
