apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
# minio-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: minio
spec:
  # 必须指定 StorageClass，使用 OpenEBS LVM 的 StorageClass 名称
  storageClassName: openebs-lvmpv  # <-- **重点修改：指定 OpenEBS LVM 的 SC**

  # MinIO 通常部署为单个副本，适合使用 RWO 模式
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: minio
  name: minio
  namespace: minio
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: pgsty/silo
          command:
            - /bin/bash
            - -c
          args:
            - minio server /data --console-address :9090
          volumeMounts:
            - mountPath: /data
              name: data
          ports:
            - containerPort: 9090
              name: console
            - containerPort: 9000
              name: api
          env:
            - name: MINIO_ROOT_USER # 指定用户名
              value: "admin"
            - name: MINIO_ROOT_PASSWORD # 指定密码，最少8位
              value: "minio123"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: console
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: api
      port: 9000
      protocol: TCP
      targetPort: 9000
