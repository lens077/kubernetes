# gatus 合成监控。配置来自 ConfigMap gatus-config(config.yaml + endpoints.yaml, install.sh 渲染),
# ntfy 凭据来自 Secret gatus-ntfy(环境变量注入; gatus 配置文件里以 "$"{NTFY_URL} 形式引用, 由 gatus 自己展开)。
# 容器加固沿用 node3 的 compose: 只读根、无新特权、tmpfs /tmp、内存上限。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data
  namespace: ${NAMESPACE}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ${SC_NAME}
  resources:
    requests:
      storage: ${GATUS_STORAGE_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: gatus
spec:
  selector:
    app.kubernetes.io/name: gatus
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: gatus
spec:
  replicas: 1
  strategy:
    type: Recreate                 # sqlite 在 PVC 上, 两个副本同时写会锁库
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
      annotations:
        config.sha256: "${CONFIG_SHA256}"   # 配置变了才滚动
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatus
          # node3 上验证过的版本, 钉 digest
          image: ghcr.io/twin/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
          imagePullPolicy: IfNotPresent
          env:
            - name: GATUS_CONFIG_PATH
              value: /config          # 目录: config.yaml + endpoints.yaml 合并读取
          envFrom:
            - secretRef:
                name: gatus-ntfy      # NTFY_URL / NTFY_TOPIC / NTFY_TOKEN(可为空)
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 192Mi }
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
