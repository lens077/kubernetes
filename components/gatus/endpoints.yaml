# gatus 端点清单。条件三件套沿用 node3: 状态码 + 证书剩余 > 30 天 + 响应 < 5s。
# 分组:
#   cluster-origin          集群内各后端的健康端点(Service 名, 不经网关)
#   observability-pipeline  不看"进程活着", 看"数据真的到了": 查 node3 Pigsty VM 有没有集群来的新 series
#   cdc                     集群内 CDC 链 (Connect task 状态 / ES 存活)
#   public-edge             经 Pangolin/newt 暴露的公网入口(与 node3 时代同一批域名)
#   node1-public            node1 VPS 上的站点
# 端点里的 `alerts: [{type: ntfy}]` 行在未配置 ntfy 时会被 install.sh 删掉。
endpoints:
  # ---------- cluster-origin ----------
  - name: alert-bridge
    group: cluster-origin
    url: http://alert-bridge.observability.svc.cluster.local:9099/healthz
    interval: 1m
    # ntfy 未配置时 /healthz 仍 200 但 body.ntfy=false; 这里只看进程, ntfy 配没配由 README 的手工验证覆盖
    conditions: ["[STATUS] == 200", "[BODY].ok == true"]
    alerts: [{type: ntfy}]
  - name: otel-collector
    group: cluster-origin
    # Service 不暴露 health_check 扩展的 13133; 打 OTLP/HTTP 接收端, GET 得 405 就是 receiver 活着
    url: http://otel-opentelemetry-collector.opentelemetry.svc.cluster.local:4318/v1/traces
    interval: 1m
    conditions: ["[STATUS] == 405"]
    alerts: [{type: ntfy}]
  - name: healthchecks
    group: cluster-origin
    url: http://healthchecks.ops.svc.cluster.local:8000/api/v3/status/
    interval: 1m
    conditions: ["[STATUS] == 200"]
    alerts: [{type: ntfy}]
  - name: bugsink
    group: cluster-origin
    url: http://bugsink.ops.svc.cluster.local:8000/health/ready
    interval: 1m
    conditions: ["[STATUS] == 200"]
    alerts: [{type: ntfy}]
  - name: postgres-cnpg
    group: cluster-origin
    # 2026-09-22: 旧 node3 Pigsty (10.10.21.172) 已随主机重装退役, 业务 PG 改为集群内 CNPG pg-main。
    # 这里探的是"集群 → pg-main 主实例"这条路。
    url: tcp://pg-main-rw.postgresql.svc.cluster.local:5432
    interval: 1m
    conditions: ["[CONNECTED] == true"]
    alerts: [{type: ntfy}]

  # ---------- observability-pipeline (数据真的进了集群内 VictoriaMetrics 吗) ----------
  # 2026-09-22: 旧 node3 Pigsty 栈随主机重装退役, VM/VL/VT/Alertmanager 全部回到集群内,
  # 采集器 (otel / otel-node / vector) 直发集群内后端。探针改走 ClusterIP, 不再依赖公网入口,
  # 因此这两条在 newt 公网入口恢复之前也有效。日志入库的端到端探针仍缺, 见 README「已知缺口」。
  - name: k8s-cluster-state-ingestion
    group: observability-pipeline
    # otel k8s_cluster receiver → 集群内 VM: 最近 5 分钟必须有 k8s_deployment_available 样本
    url: "http://vm-single-victoria-metrics-single-server.victoriametrics.svc.cluster.local:8428/api/v1/query?query=max_over_time(k8s_deployment_available%5B5m%5D)"
    interval: 2m
    client: {timeout: 10s}
    conditions: ["[STATUS] == 200", "[BODY].status == success", "len([BODY].data.result) > 0"]
    alerts: [{type: ntfy}]
  - name: hostmetrics-ingestion
    group: observability-pipeline
    # otel-node DaemonSet → 集群内 VM: 最近 5 分钟有主机指标样本 (system.cpu.time → system_cpu_time_seconds_total)
    # ⚠️ 依赖 ADDON_OTEL_NODE; 该组件未启用时这条会持续红, 关掉它而不是改判据。
    url: "http://vm-single-victoria-metrics-single-server.victoriametrics.svc.cluster.local:8428/api/v1/query?query=count(max_over_time(system_cpu_time_seconds_total%5B5m%5D))"
    interval: 2m
    client: {timeout: 10s}
    conditions: ["[STATUS] == 200", "[BODY].status == success", "len([BODY].data.result) > 0"]
    alerts: [{type: ntfy}]

  # ---------- cdc (PG → Debezium → Kafka → ES, 全在集群内; 替代原 node3 cdc-connect-exporter 的 task 级告警) ----------
  # connector 级 RUNNING 而 task 级 FAILED 是这条链三次事故的共同形态, 所以两级都看。
  # Connect REST 默认被 Strimzi NetworkPolicy 封住, 由 components/kafka/cdc/connect-rest-netpol.yaml 放行 ops。
  - name: cdc-source-task
    group: cdc
    url: http://my-connect-cluster-connect-api.kafka.svc.cluster.local:8083/connectors/ecommerce-postgres-source/status
    interval: 1m
    conditions: ["[STATUS] == 200", "[BODY].connector.state == RUNNING", "[BODY].tasks[0].state == RUNNING"]
    alerts: [{type: ntfy}]
  - name: cdc-sink-task
    group: cdc
    url: http://my-connect-cluster-connect-api.kafka.svc.cluster.local:8083/connectors/ecommerce-elasticsearch-sink/status
    interval: 1m
    conditions: ["[STATUS] == 200", "[BODY].connector.state == RUNNING", "[BODY].tasks[0].state == RUNNING"]
    alerts: [{type: ntfy}]
  - name: elasticsearch
    group: cdc
    # 安全开启后匿名请求 401; 401 恰恰证明进程活着 (与 node3 时代 watchdog 同一判据), 不在探针里放凭据
    url: http://elasticsearch.elasticsearch.svc.cluster.local:9200/
    interval: 1m
    conditions: ["[STATUS] == 401", "[RESPONSE_TIME] < 3000"]
    alerts: [{type: ntfy}]

  # ---------- public-edge (经 Pangolin/newt 的公网入口, 清单沿用旧 node3 时代) ----------
  # ⚠️ 2026-09-22: 旧 node3/node4/node5 三个 newt site 已失效, 集群 newt 尚未部署,
  #    这一组在新 site 建好并迁移资源之前会持续红。要么先关这一组, 要么先完成迁移。
  - name: gateway
    group: public-edge
    url: https://gateway.apikv.com/healthz
    interval: 1m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h", "[RESPONSE_TIME] < 5000"]
    alerts: [{type: ntfy}]
  - name: mall
    group: public-edge
    url: https://shop.apikv.com/
    interval: 1m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h", "[RESPONSE_TIME] < 5000"]
    alerts: [{type: ntfy}]
  - name: casdoor
    group: public-edge
    url: https://casdoor.apikv.com/api/health
    interval: 1m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h", "[RESPONSE_TIME] < 5000"]
    alerts: [{type: ntfy}]
  - name: config-center-web
    group: public-edge
    url: https://config.apikv.com/
    interval: 1m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h", "[RESPONSE_TIME] < 5000"]
    alerts: [{type: ntfy}]
  - name: config-center-api
    group: public-edge
    url: https://config-api.apikv.com/health
    interval: 1m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 401", "[CERTIFICATE_EXPIRATION] > 720h", "[RESPONSE_TIME] < 5000"]
    alerts: [{type: ntfy}]
  - name: grafana-edge
    group: public-edge
    url: https://grafana.apikv.com/api/health
    interval: 2m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h"]
    alerts: [{type: ntfy}]
  - name: bugsink-edge
    group: public-edge
    url: https://bugsink.apikv.com/health/ready
    interval: 2m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h"]
    alerts: [{type: ntfy}]

  # ---------- node1-public ----------
  - name: homepage
    group: node1-public
    url: https://apikv.com/
    interval: 5m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h"]
    alerts: [{type: ntfy}]
  - name: pangolin
    group: node1-public
    url: https://pangolin.apikv.com/
    interval: 5m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h"]
    alerts: [{type: ntfy}]
  - name: vault
    group: node1-public
    url: https://vault.apikv.com/
    interval: 5m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 307", "[CERTIFICATE_EXPIRATION] > 720h"]
    alerts: [{type: ntfy}]
  - name: ntfy
    group: node1-public
    url: https://ntfy.apikv.com/v1/health
    interval: 5m
    client: {timeout: 10s, ignore-redirect: true}
    conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h"]
    alerts: [{type: ntfy}]
