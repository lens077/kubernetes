# 已有的 fluent-bit 对接 Loki：在 OUTPUT 段追加这一块即可（不需要装 Alloy/Promtail）
# 集群内地址：loki.logging.svc.cluster.local:3100
[OUTPUT]
    name                   loki
    match                  *
    host                   loki.logging.svc.cluster.local
    port                   3100
    line_format            json
    auto_kubernetes_labels on
    labels                 job=fluent-bit

# Grafana 数据源（grafana 组件会自动预置，这里只是备查）：
#   http://loki.logging.svc.cluster.local:3100
