# Dragonfly AUTH 密码: 真相源 OpenBao(${ESO_STORE}) 的 k8s/${CLUSTER_NAME}/dragonfly(键 password),
# ESO 物化成 Secret dragonfly-auth —— install.sh 的 passwordFromSecret 同名同键。
# 集群重装后凭据自动流回; get_cred 的随机值只是 OFFLINE 降级路径(见 _lib/env.sh cred_via_eso)。
# 首次迁移用 tools/openbao-seed.sh dragonfly(取集群现值, 不换密码); 轮换用 --rotate(Dragonfly 每次启动读 Secret)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-auth
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: dragonfly-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: k8s/${CLUSTER_NAME}/dragonfly
        property: password
