apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly-tls
  namespace: dragonfly
spec:
  secretName: dragonfly-tls
  issuerRef:
    name: global-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - dragonfly
    - dragonfly.dragonfly.svc
    - dragonfly.dragonfly.svc.cluster.local
    - dragonfly.dev.test
    - redis-dev.apikv.com
