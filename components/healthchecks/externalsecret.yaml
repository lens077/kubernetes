# healthchecks: SECRET_KEY 真相源 OpenBao/Vault k8s/${CLUSTER_NAME}/healthchecks(键 secret-key / admin-password)。
# 超级用户口令只在首次创建时用(install.sh 里的 createsuperuser), 原值迁移不轮换。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-secret
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: healthchecks-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef: { key: k8s/${CLUSTER_NAME}/healthchecks, property: secret-key }
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: k8s/${CLUSTER_NAME}/healthchecks, property: admin-password }
