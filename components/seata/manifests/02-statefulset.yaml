# StatefulSet 而非 Deployment：store.mode=file 的事务日志（sessionStore）必须持久化，
# 否则 TC 重启后未完成的全局事务全丢——那正是 Seata 存在的意义。
---
apiVersion: v1
kind: Service
metadata:
  name: seata-server
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: seata-server
spec:
  type: ClusterIP
  ports:
    - name: tc                          # Netty 私有协议，不是 HTTP
      port: 8091
      targetPort: tc
      protocol: TCP
  selector:
    app.kubernetes.io/name: seata-server
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seata-server
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: seata-server
spec:
  serviceName: seata-server
  replicas: 1                           # file store 只支持单副本；多副本要换 db/raft，见 README
  selector:
    matchLabels:
      app.kubernetes.io/name: seata-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seata-server
      annotations:
        # ConfigMap 改了要重启才生效（无 helm checksum 机制），改完手动：
        #   kubectl -n seata rollout restart statefulset/seata-server
        seata.dev/config: application-yml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000                   # PVC 属主，否则非 root 进程写不进 sessionStore
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seata-server
          # ⚠️ 必须钉版本：Docker Hub 的 latest 已指向 2.7.0（GitHub 上仍是 prerelease）
          image: docker.io/apache/seata-server:2.6.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tc
              containerPort: 8091
              protocol: TCP
          env:
            # 2.6 起 JVM 参数按容器内存自动计算，不再需要手写 -Xmx
            - name: SEATA_IP            # 注册进 TC 元数据的地址；单副本 file registry 下
              valueFrom:                # 客户端走 Service DNS，这里给 Pod IP 即可
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: config
              mountPath: /seata-server/resources/application.yml
              subPath: application.yml  # ⚠️ 用 subPath 只覆盖单文件：整卷挂载会遮蔽
                                        # resources/ 下的 logback 等文件，启动即失败
            - name: data
              mountPath: /seata-server/sessionStore
            - name: logs
              mountPath: /seata-server/logs
          # 2.6 无 HTTP 端点，只能探 TCP 端口
          startupProbe:
            tcpSocket: { port: tc }
            periodSeconds: 5
            failureThreshold: 36        # JVM 冷启动最多给 3 分钟
          livenessProbe:
            tcpSocket: { port: tc }
            periodSeconds: 20
          readinessProbe:
            tcpSocket: { port: tc }
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi               # 官方示例给 4Gi；本集群内存紧，轻负载 1Gi 够用
      volumes:
        - name: config
          configMap:
            name: seata-server-config
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${SC_NAME}
        resources:
          requests:
            storage: ${SEATA_STORAGE_SIZE}
