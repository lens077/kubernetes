# Bugsink: SECRET_KEY 与超级用户口令的真相源在 OpenBao/Vault k8s/${CLUSTER_NAME}/bugsink
# (键 secret-key / admin-password)。CREATE_SUPERUSER 只在首次启动时生效, 之后存库——原值迁移, 不轮换。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bugsink-secret
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: bugsink-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secretKey }}"
        CREATE_SUPERUSER: "admin@${HOSTNAME}:{{ .adminPassword }}"
  data:
    - secretKey: secretKey
      remoteRef: { key: k8s/${CLUSTER_NAME}/bugsink, property: secret-key }
    - secretKey: adminPassword
      remoteRef: { key: k8s/${CLUSTER_NAME}/bugsink, property: admin-password }
