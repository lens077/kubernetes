# 观测与告警链路自身的告警 —— "告警系统坏了谁来告警"。
# 2026-09-03 新增(集群内替代 node3 Pigsty 的 vmalert/Alertmanager 时补上)。
#
# 数据来源: opentelemetry 组件 values.yaml 的 prometheus receiver 抓 vmalert(:8880)、
# alertmanager(:9093) 与 collector 自身(:8888)。指标名均为两者自带的标准名;
# counter 经 prometheus receiver → OTLP → VM(usePrometheusNaming) 后保留 _total 后缀(与 hubble_drop_total 同路径)。
# 2026-09-24 现场枚举 Collector 0.158.0 指标：没有 otelcol_exporter_send_failed_*，
# 但每个 exporter 都持续暴露 queue_size / queue_capacity。用队列持续高水位检测后端拒收或不可达，
# 不保留引用不存在指标的「静默绿」规则。
# ⚠️ 每条规则都必须有 for:(Watchdog 除外——它就是要永远 firing)。
groups:
  - name: observability-pipeline
    interval: 15s
    rules:
      - alert: Watchdog
        # 永远 firing 的"心跳": 它出现在 Alertmanager 里 = vmalert→Alertmanager 这段活着。
        # Alertmanager 把它路由到 null receiver(不推手机); gatus 查 /api/v2/alerts 验证它在。
        expr: 'vector(1)'
        labels: { severity: none, category: observability }
        annotations:
          summary: 告警链路心跳(永远 firing, 不推送)
          description: 这条告警消失说明 vmalert 停止评估或到 Alertmanager 的通知断了。

      - alert: VMAlertNotifierErrors
        # vmalert → Alertmanager 发送失败(网络/Alertmanager 挂了)。
        expr: 'increase(vmalert_alerts_send_errors_total[10m]) > 0'
        for: 10m
        labels: { severity: critical, category: observability }
        annotations:
          summary: vmalert 向 Alertmanager 发送告警失败
          description: 最近 10 分钟有发送错误且未恢复。检查 observability/alertmanager StatefulSet 与 vmalert 的 -notifier.url。此时所有告警都到不了手机。

      - alert: VMAlertRemoteWriteErrors
        # remoteWrite 断了 ALERTS_FOR_STATE 就写不回 VM, AlertFiringTooLong 元规则失效, vmalert 重启后 for 状态也丢。
        expr: 'increase(vmalert_remotewrite_errors_total[10m]) > 0'
        for: 10m
        labels: { severity: warning, category: observability }
        annotations:
          summary: vmalert remoteWrite 到 VictoriaMetrics 失败
          description: 告警状态无法持久化。检查 vmalert 的 -remoteWrite.url 与 VM 写入端口。

      - alert: AlertmanagerNotificationFailures
        # Alertmanager → 告警桥失败(桥挂了/ntfy 不通 → 桥回 502)。
        expr: 'increase(alertmanager_notifications_failed_total[10m]) > 0'
        for: 10m
        labels: { severity: critical, category: observability }
        annotations:
          summary: 'Alertmanager 通知失败 (integration={{ $labels.integration }})'
          description: 最近 10 分钟通知投递失败且未恢复。先 kubectl -n observability logs deploy/alert-bridge 看桥是否收到、ntfy 是否返回非 2xx。

      - alert: AlertmanagerMetricsMissing
        # 兜底: 抓不到 Alertmanager 自身指标, 上面两条 Alertmanager 规则会安静失效。
        expr: 'absent(alertmanager_build_info) == 1'
        for: 10m
        labels: { severity: warning, category: observability }
        annotations:
          summary: 抓不到 Alertmanager 指标
          description: 连续 10 分钟没有 alertmanager_build_info。检查 otel collector 的 alertmanager 抓取 job 与 Alertmanager Pod。

      - alert: AlertBridgeMetricsMissing
        # 计数器从启动起导出零值；状态或决策指标缺失都不能当成零失败。
        expr: 'absent(alert_bridge_state_entries) == 1 or absent(alert_bridge_notifications_total) == 1'
        for: 10m
        labels: { severity: warning, category: observability, notification_class: ticket }
        annotations:
          summary: 抓不到 alert-bridge 降噪与投递指标
          description: 连续 10 分钟缺少状态或决策指标。检查 bridge /metrics 与 OTel Collector 的 alert-bridge scrape job；同链路故障时本告警也可能无法送达。
          dashboard: https://grafana.apikv.com/d/ntfy-alerting-overview
          runbook_url: https://grafana.apikv.com/d/ntfy-alerting-overview?viewPanel=13

      - alert: AlertBridgePublishFailures
        expr: 'sum(increase(alert_bridge_notifications_total{result="failed"}[10m])) > 0'
        for: 5m
        labels: { severity: critical, category: observability, notification_class: page }
        annotations:
          summary: alert-bridge 向 ntfy 发布失败
          description: 10 分钟窗口内存在发布失败且条件持续 5 分钟，不等于连续失败 5 分钟。检查 bridge 日志、ntfy 健康和 publisher 配置；失败不推进退避，AM 会重试。不要输出 token 或删除状态 PVC。
          dashboard: https://grafana.apikv.com/d/ntfy-alerting-overview
          runbook_url: https://grafana.apikv.com/d/ntfy-alerting-overview?viewPanel=13

      - alert: AlertBridgeNotificationFlood
        # 20/h 是试运行噪声预算，须观察 24–48h 后校准；超限也可能来自真实事件变化。
        # AM 的 5m webhook 刷新不是手机通知量，sent 只证明 ntfy 已接受发布。
        expr: 'sum(increase(alert_bridge_notifications_total{result="sent",notification_class!="test"}[1h])) > 20'
        for: 15m
        labels: { severity: warning, category: observability, notification_class: ticket }
        annotations:
          summary: alert-bridge 发布量超过试运行噪声预算
          description: 非测试主题一小时发布超过 20 条并持续 15 分钟。先区分真实事件变化与重复，再检查 groupKey 和退避状态 PVC；超限不等于去重失效，不以静音掩盖故障。
          dashboard: https://grafana.apikv.com/d/ntfy-alerting-overview
          runbook_url: https://grafana.apikv.com/d/ntfy-alerting-overview?viewPanel=13

      - alert: OTelCollectorExporterQueueHigh
        # 后端拒收或不可达时 exporter queue 会积压；当前三个后端均有 queue series，正常值为 0。
        expr: 'max by (exporter) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8'
        for: 10m
        labels: { severity: warning, category: observability }
        annotations:
          summary: 'OTel Collector 导出队列超过 80% (exporter={{ $labels.exporter }})'
          description: '数据即将被丢弃。对照 exporter 名(victoriametrics/victorialogs/victoriatraces)检查对应后端、网络和磁盘；VL/VT 撑满 PVC 会拒写。'
