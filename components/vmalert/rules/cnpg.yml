# CNPG(pg-main)告警 —— 对应 node3 Pigsty pgsql.yml 里 16 条 PG 告警的语义(2026-09-03 收割,
# 原件在 backup/pigsty-node3-20260921/), 指标换成 CNPG 实例自带的 cnpg_* 系列。
# 2026-09-17 CNPG 曾被删除、本文件随之删除; 2026-09-22 重建后 CNPG 是业务主库, 本文件必须在。
# 2026-09-23 发现 live vmalert 缺这 10 条(k1 上的副本也被删), 已恢复。
#
# 数据来源: opentelemetry 组件 values.yaml 的 prometheus receiver `cnpg` job 抓每个
# 实例 Pod 的 :9187/metrics(label cnpg.io/podRole=instance), 写入 VictoriaMetrics。
#
# ⚠️ 指标名来自 CNPG 的 default-monitoring 查询清单(cnpg_collector_* / cnpg_pg_* / cnpg_backends_*)。
#    团队规矩(ecommerce-k8s.yml 头部): 上线前逐个在 VM 里查到 series 再启用;
#    查不到就先修采集, 不许凭记忆改名。兜底规则 CNPGMetricsMissing 保证"没数据"会红而不是安静。
# ⚠️ 每条规则都必须有 for:。
groups:
  - name: cnpg
    interval: 15s
    rules:
      - alert: CNPGMetricsMissing
        # 兜底: 采集断了本文件其它规则会全部变成"无数据"。
        expr: 'absent(cnpg_collector_up) == 1'
        for: 10m
        labels: { severity: critical, category: database }
        annotations:
          summary: CNPG 指标停止写入 VictoriaMetrics
          description: 连续 10 分钟没有 cnpg_collector_up。检查 postgresql 命名空间的实例 Pod 是否 Running、otel collector 的 cnpg 抓取 job 与到 VM 的写入。此时本文件所有数据库告警均已失效。

      - alert: PostgresDown
        # Pigsty: PostgresDown / PgExporterDown。cnpg_collector_up 由实例 Pod 自带的 exporter 上报。
        expr: 'cnpg_collector_up == 0'
        for: 10m
        keep_firing_for: 5m
        labels: { severity: critical, category: database }
        annotations:
          summary: 'PostgreSQL 实例不可用 {{ $labels.pod }}'
          description: 实例持续不可用超过 10 分钟。先看 kubectl -n postgresql get cluster pg-main 与 describe pod；核对数据库连接及业务影响。

      - alert: PostgresRestarted
        # Pigsty: PostgresRestart。postmaster 启动时间在 10 分钟内变化 = 发生过重启。
        # 已恢复可用的正常重启不通知；持续不可用由 PostgresDown 核心告警覆盖。
        expr: '(changes(cnpg_pg_postmaster_start_time[10m]) > 0) and on(pod) (cnpg_collector_up == 0)'
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, category: database }
        annotations:
          summary: 'PostgreSQL 实例最近重启 {{ $labels.pod }}'
          description: 正常的参数变更(shared_buffers 等)也会触发滚动重启；先对照 CNPG 事件区分"计划内"与"崩溃"。

      - alert: PostgresReplicationLag
        # Pigsty: PostgresReplicationLag(阈值 30s)。单实例时该指标不存在, 规则自然不触发。
        expr: 'cnpg_pg_replication_lag > 30'
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, category: database }
        annotations:
          summary: '从库复制延迟 {{ $value | printf "%.0f" }}s {{ $labels.pod }}'
          description: 复制延迟超过 30 秒持续 5 分钟。看从库 IO/网络与主库 WAL 生成速率；延迟期间 -ro 服务读到的是旧数据。

      - alert: PostgresXidWrapAround
        # Pigsty: PostgresXidWarpAround。阈值与 autovacuum_freeze_max_age(1e9)对齐: 超过它 autovacuum 已经在强制冻结。
        expr: 'max by (pod) (cnpg_pg_database_xid_age) > 1000000000'
        for: 15m
        labels: { severity: critical, category: database }
        annotations:
          summary: '事务 ID 年龄超过 10 亿 {{ $labels.pod }}'
          description: 距事务 ID 回卷保护停库已不远。立刻对 age 最大的库做 VACUUM FREEZE，并检查是否有长事务/失效复制槽阻止冻结。

      - alert: PostgresConnUsageHigh
        # Pigsty: PostgresConnUsageHigh(80%)。max_connections 来自 cnpg_pg_settings_setting{name="max_connections"}。
        expr: 'sum by (pod) (cnpg_backends_total) / on (pod) cnpg_pg_settings_setting{name="max_connections"} > 0.8'
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, category: database }
        annotations:
          summary: '连接数占用超过 80% {{ $labels.pod }}'
          description: 业务应走 Pooler(事务池)而不是直连；先查是谁在直连(pg_stat_activity 的 application_name/client_addr)，再考虑调 max_connections。

      - alert: PostgresIdleInTransaction
        # Pigsty: PostgresIdleInXact。cnpg_backends_max_tx_duration_seconds 按 state 分组, 取 idle in transaction。
        expr: 'max by (pod) (cnpg_backends_max_tx_duration_seconds{state="idle in transaction"}) > 300'
        for: 10m
        keep_firing_for: 5m
        labels: { severity: warning, category: database }
        annotations:
          summary: '存在超过 5 分钟的 idle-in-transaction 会话 {{ $labels.pod }}'
          description: 事务开着不提交会挡住 autovacuum 并持有锁。实例参数 idle_in_transaction_session_timeout=10min 会强杀，但更该找到是哪个服务泄漏了事务。

      - alert: PostgresWALArchiveFailing
        # Pigsty 没有等价规则(pgbackrest 走死人开关); CNPG 的 WAL 归档失败会让备份 PITR 断链。
        # 2026-09-24 现场枚举确认 exporter 使用 Prometheus counter 名 `_total`；少后缀时规则永久无 series。
        expr: 'increase(cnpg_pg_stat_archiver_failed_count_total[15m]) > 0'
        for: 15m
        labels: { severity: critical, category: database }
        annotations:
          summary: 'WAL 归档持续失败 {{ $labels.pod }}'
          description: 15 分钟内有归档失败且未恢复。查对象存储凭据/网络(kubectl -n postgresql logs <pod> | grep -i archive)；归档断了等于备份的恢复点在倒退。

      - alert: CNPGBackupStale
        # 备份新鲜度的第一道: 最近一次成功备份超过 26h(每日 ScheduledBackup + 2h 余量)。
        #
        # 2026-10-21 二次修正(接对象存储备份后): 数据源整体换掉。
        #   实例导出器的 cnpg_collector_last_available_backup_timestamp **看不见插件做的备份**
        #   —— 它只认 1.26 起已废弃的 in-tree barmanObjectStore。改用 Barman Cloud Plugin 后,
        #   即便备份真实成功, 该指标也恒为 0。后果是双向的: 旧表达式恒真永久告警,
        #   而真的备份缺失反而检测不出来。
        #   现在改读 cnpg_backup_last_success_timestamp_seconds: 由
        #   postgres/manifests/cnpg-backup-freshness-probe 直接查 K8s Backup 对象得来的真值。
        # 保留 "> 0" 这道闸: 0 表示"从没有成功备份", 那不是"变旧", 归下一条规则管。
        # ⚠️ 必须包 last_over_time(...[2h])：探针 30 分钟一轮，而 VictoriaMetrics 默认
        #    lookback 只有 5 分钟，直接写裸指标名的话每轮中间 25 分钟 series 等于"不存在"，
        #    规则会周期性假报警。
        expr: 'last_over_time(cnpg_backup_last_success_timestamp_seconds[2h]) > 0 and (time() - last_over_time(cnpg_backup_last_success_timestamp_seconds[2h]) > 26 * 3600)'
        for: 30m
        labels: { severity: critical, category: backup }
        annotations:
          summary: 'CNPG 集群 {{ $labels.cluster }} 超过 26 小时没有成功备份'
          description: 曾有成功备份但已超过 26 小时没新的。检查 ScheduledBackup 与最近 Backup 的 phase(kubectl -n postgresql get backup)，以及 freshness-probe CronJob 是否在正常跑。没有备份的数据库不算生产库。

      - alert: CNPGNoBackupEver
        # 同上数据源修正: 探针值为 0 代表一次成功的 Backup 都没有。
        # 2026-10-21 之后备份已真实启用, 这条再响就是真故障而不是既定缺口,
        # 因此去掉了当初标在它身上的 known_gap 标签。
        expr: 'last_over_time(cnpg_backup_last_success_timestamp_seconds[2h]) == 0'
        for: 6h
        labels: { severity: warning, category: backup }
        annotations:
          summary: 'CNPG 集群 {{ $labels.cluster }} 没有任何成功备份'
          description: 探针连续 6 小时没找到 completed 的 Backup。查 kubectl -n postgresql get backup 的 phase 与失败原因，以及 ObjectStore pg-main-backups 指向的桶是否可达、凭据是否仍有效。

      - alert: CNPGBackupProbeMissing
        # 兜底: 上面两条都依赖探针推的数据。探针一停, 那两条会因为没数据而静默变绿 ——
        # 死人开关必须自己被看着, 否则"没告警"和"没监控"长得一模一样。
        expr: 'absent(last_over_time(cnpg_probe_run_timestamp_seconds[2h]))'
        for: 15m
        labels: { severity: warning, category: backup }
        annotations:
          summary: 'CNPG 备份新鲜度探针已停止上报 {{ $labels.cluster }}'
          description: 探针 CronJob(postgresql 命名空间 cnpg-backup-freshness-probe)超过 3 小时没推数据。此时上面两条备份告警已失效。先看 kubectl -n postgresql get cronjob,job 与最近一次 Job 的日志。

      - alert: CNPGWALArchiveFailed
        # 归档失败才是"备份链路真断了"的直接信号: 对象存储不可达、凭据失效、
        # 插件 sidecar 异常, 都会让 archive_command 返回非零, failed_count 随之上涨。
        # 这条与上面几条互相独立 —— 不看 Backup 对象, 只看 PostgreSQL 自己的 pg_stat_archiver。
        # for: 10m 过滤 rollout 期间几秒~几分钟的瞬时失败(2026-10-22 注入 sidecar 时出现过 12 次)。
        expr: 'increase(cnpg_pg_stat_archiver_failed_count_total[15m]) > 0'
        for: 10m
        labels: { severity: critical, category: backup }
        annotations:
          summary: 'CNPG 集群 {{ $labels.cnpg_cluster }} WAL 归档连续失败'
          description: archive_command 连续失败超过 10 分钟。归档一断，RPO 就开始追着现在跑；即使有旧的 base backup 也补不上这一段。查 ObjectStore pg-main-backups 指向的桶是否可达、凭据是否仍有效，以及实例日志里的 archive 报错。

      - alert: CNPGWALArchiveStalled
        # 兜底: 归档进程整体死掉时既不会成功也不会失败, 上面那条看不到。
        # 阈值必须容忍空闲库 —— 2026-10-22 曾按"archive_timeout=5min 所以空闲也每 5 分钟归档一次"
        # 设 1 小时阈值, 实测误报: PostgreSQL 只在**有新 WAL 时**才强制切段,
        # 完全空闲的库可以几十分钟不归档(当时 LSN 70 秒零推进、pg_wal 无 .ready 堆积、failed_count=0)。
        # 本库实测再空闲每小时仍有一对归档, 24 小时阈值不会漏真故障也不会误报空闲。
        expr: 'cnpg_pg_stat_archiver_seconds_since_last_archival > 86400'
        for: 1h
        labels: { severity: warning, category: backup }
        annotations:
          summary: 'CNPG 集群 {{ $labels.cnpg_cluster }} 超过 24 小时没有任何 WAL 归档'
          description: 既没有成功归档也没有失败记录，通常是归档进程整体停止。先确认库里是否真的没有写入（空闲库不会归档）；有写入却 24 小时无归档，查 pg-main-1 实例日志与插件 sidecar 状态。
