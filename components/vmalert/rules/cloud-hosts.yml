# 云主机（node0–node4）资源与失联告警 —— 2026-09-29 新增。
#
# 数据来源：observability 仓 roles/host_otel（2026-09-29 起 otelcol-contrib：主机/容器指标 + journald/容器日志）
# → otlp-dev.apikv.com（bearer token）→ 集群 collector otlp/public → VictoriaMetrics / VictoriaLogs。资源标签：
#   host_name（node0…）  host_group="cloud"  cloud_provider  host_watchdog="true|false"
# K8s 节点（k1–k3）走 k8s_node_name，不在本组；它们的 Ready 状态由 ecommerce-k8s 组负责。
#
# 与 host-watchdog（ecommerce/infrastructure/host-watchdog，主机内每 5 分钟巡检直推 ntfy）的分工，
# 目的是同一件事只提醒一次：
#   host-watchdog 负责：容器、systemd 单元、本机 HTTP、Pangolin 站点、磁盘水位（85% 待办 / 95% 关注）
#   本组负责：主机指标失联、内存、CPU（host-watchdog 不查这三项），
#            以及**没有 host-watchdog 的主机**（host_watchdog="false"）的磁盘水位，阈值与它一致。
# 给 node3/node4 装上 host-watchdog 后，把 inventory.host-otel.yml 的 host_watchdog 改成 true 并重跑，
# 这里的磁盘规则会自动不再覆盖它们，不用改本文件。
#
# 失联规则只做待办（warning）：主机整机宕掉时，对外服务由 Gatus 直推关注级；这里再发关注级只会重复。
# ⚠️ 每条规则都必须有 for:。
groups:
  - name: cloud-hosts
    interval: 30s
    rules:
      - alert: CloudHostMetricsMissing
        # 过去 1 天出现过、最近 5 分钟没有数据的主机。不写死主机清单：新主机接入即受保护，
        # 下线的主机最多提醒 1 天（或手动静默）。其余云主机也全部没有数据时由下一条统一报，这里不逐台重复。
        expr: >-
          (
            group by (host_name) (max_over_time(system_memory_utilization_ratio{host_group="cloud"}[1d]))
            unless
            group by (host_name) (max_over_time(system_memory_utilization_ratio{host_group="cloud"}[5m]))
          )
          and on() (count(group by (host_name) (max_over_time(system_memory_utilization_ratio{host_group="cloud"}[5m]))) > 0)
        for: 10m
        labels: { severity: warning, category: host }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 指标中断'
          description: 超过 15 分钟收不到该主机的 hostmetrics，其它云主机正常。先 ssh 看 systemctl status otelcol 与 journalctl -u otelcol；ssh 也不通则是主机或网络故障，对外影响看 Gatus。

      - alert: CloudHostsAllMetricsMissing
        # 所有云主机同时中断，通常是公共通道坏了：otlp-dev.apikv.com（Pangolin / node1）、集群网关、
        # collector otlp/public 或 token 被轮换，而不是 5 台同时宕机。
        expr: >-
          (count(max_over_time(system_memory_utilization_ratio{host_group="cloud"}[1d])) > 0)
          unless on() count(max_over_time(system_memory_utilization_ratio{host_group="cloud"}[5m]))
        for: 10m
        labels: { severity: warning, category: observability }
        annotations:
          summary: 所有云主机的主机指标同时中断
          description: 按公共通道排查：curl https://otlp-dev.apikv.com/v1/metrics 应返回 401（入口通）；再看 opentelemetry/otel-opentelemetry-collector 日志与 Secret otlp-public-auth 是否被轮换（轮换后需重跑 make host-otel）。

      - alert: CloudHostMemoryHigh
        # used 不含 page cache / buffer；持续 90% 以上说明真的缺内存，node2/node4 只有 1.6–2G。
        expr: 'sum by (host_name) (system_memory_utilization_ratio{host_group="cloud",state="used"}) > 0.9'
        for: 15m
        labels: { severity: warning, category: host }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 内存使用 {{ $value | humanizePercentage }}'
          description: 持续 15 分钟以上。ssh 后 ps aux --sort=-rss | head 或 docker stats --no-stream 找占用大户；再涨可能触发 OOM kill 业务容器。

      - alert: CloudHostCPUSaturated
        # iowait 算空闲：它不是 CPU 在干活，且 io_uring 程序（如 Dragonfly）等待网络事件也会被记成 iowait。
        expr: '1 - sum by (host_name) (system_cpu_utilization_ratio{host_group="cloud",state=~"idle|wait"}) > 0.9'
        for: 30m
        labels: { severity: warning, category: host }
        annotations:
          summary: '云主机 {{ $labels.host_name }} CPU 使用 {{ $value | humanizePercentage }}'
          description: 持续 30 分钟以上（短时尖峰不报）。用 top / docker stats 找进程；突发且无业务原因时留意挖矿或被攻击。

      - alert: CloudHostDiskFilling
        # 只覆盖没有 host-watchdog 的主机；有 host-watchdog 的主机磁盘由它报（同为 85%），避免重复。
        # used / (used + free) 与 df 的 Use% 同口径，和 host-watchdog 的阈值可直接对照。
        expr: >-
          sum by (host_name, mountpoint) (system_filesystem_usage_bytes{host_group="cloud",host_watchdog="false",state="used"})
          / sum by (host_name, mountpoint) (system_filesystem_usage_bytes{host_group="cloud",host_watchdog="false",state=~"used|free"})
          > 0.85
        for: 15m
        labels: { severity: warning, category: host }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 磁盘 {{ $labels.mountpoint }} 已用 {{ $value | humanizePercentage }}'
          description: df -h {{ $labels.mountpoint }}；用 du -xh --max-depth=1 找增长来源，常见是容器日志与镜像（docker system df）。

      - alert: CloudHostDiskAlmostFull
        expr: >-
          sum by (host_name, mountpoint) (system_filesystem_usage_bytes{host_group="cloud",host_watchdog="false",state="used"})
          / sum by (host_name, mountpoint) (system_filesystem_usage_bytes{host_group="cloud",host_watchdog="false",state=~"used|free"})
          > 0.95
        for: 5m
        labels: { severity: critical, category: host }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 磁盘 {{ $labels.mountpoint }} 即将写满（{{ $value | humanizePercentage }}）'
          description: 写满后数据库、容器和日志都会失败。先腾出空间（清理旧日志 / 未用镜像），再查增长来源。

  # ---- 采集代理自身（2026-09-29 contrib 升级时新增）----
  # 数据来自代理自己的 otelcol_* 指标（127.0.0.1:18888 → prometheus/self → 与主机指标同一出口）。
  # 出口整体断掉时这些指标也发不出来，那种情况由上面的 CloudHostMetricsMissing / AllMetricsMissing 报；
  # 这一组只抓「指标还在、日志出了问题」的半故障。
  - name: cloud-hosts-telemetry
    interval: 1m
    rules:
      - alert: CloudHostLogExportFailing
        # 永久错误（4xx，如请求体被 WAF 拦成 403、单条超限 413）不重试，直接丢弃，只有这个计数能看到。
        expr: 'sum by (host_name) (increase(otelcol_exporter_send_failed_log_records_total{host_group="cloud"}[15m])) > 0'
        for: 5m
        labels: { severity: warning, category: observability }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 日志发送失败，15 分钟内丢弃 {{ $value | humanize }} 条'
          description: ssh 后 journalctl -u otelcol -n 50 看具体状态码。403 且入口在 node1 Traefik 时先查 SafeLine/CrowdSec 是否拦了 otlp-dev.apikv.com；401 是 token 被轮换，重跑 make host-otel。

      - alert: CloudHostTelemetryBacklog
        # 落盘队列（容量 5000 个请求，约十几个小时）持续积压：发送跟不上产生，或出口时好时坏。
        expr: >-
          max by (host_name) (
            otelcol_exporter_queue_size{host_group="cloud"} / otelcol_exporter_queue_capacity{host_group="cloud"}
          ) > 0.2
        for: 15m
        labels: { severity: warning, category: observability }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 遥测发送队列积压 {{ $value | humanizePercentage }}'
          description: 队列满了以后新数据会被拒收。看 journalctl -u otelcol 里的重试日志与 otlp-dev.apikv.com 的可用性；积压在 /var/lib/otelcol。

      - alert: CloudHostJournaldStalled
        # 每台主机每小时至少有 cron、sshd 等几十上百行 journal；1 小时一行都没收到，说明 journald 读取卡住
        # （journalctl 子进程被杀、cursor 损坏等），而主机指标还在（否则由失联规则报）。
        expr: >-
          sum by (host_name) (increase(otelcol_receiver_accepted_log_records_total{host_group="cloud",receiver="journald"}[1h])) == 0
          and on (host_name) group by (host_name) (system_memory_utilization_ratio{host_group="cloud"})
        for: 15m
        labels: { severity: warning, category: observability }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 1 小时没有采到 journald 日志'
          description: systemctl restart otelcol 通常即可恢复；仍不行就删 /var/lib/otelcol/receiver_journald_* 后重启（会从当前位置重新开始，中间的日志不补）。
