# Shared host resource alerts. Inventory: hosts/observability/hosts.json.
# Raw signals remain available; all resource formulas live only in host-recording.yml.
# This group replaces the six CloudHost* resource alerts, not a parallel notification path.
# K8s Ready stays in ecommerce-k8s. Disk alerts are owned by watchdog OR vmalert, never both.
# Existing CPU/memory/disk thresholds and hold periods are preserved; missing telemetry is ticket-only.
groups:
  - name: host-resources
    interval: 30s
    rules:
      - alert: HostMetricsMissing
        expr: >-
          (host:expected_info unless on(host,host_kind) (time() - host:last_seen_timestamp_seconds < 300))
          and on(host_kind) group by(host_kind) (time() - host:last_seen_timestamp_seconds < 300)
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 10m
        labels: {severity: warning, category: host}
        annotations:
          summary: '主机 {{ $labels.host }} 指标中断或尚未接入'
          description: '预期主机超过 5 分钟没有原始样本，且持续 10 分钟。云主机查 otelcol；K8s 节点查 otel-node DaemonSet。不要把记录规则的评估时间当成主机心跳。'
          dashboard: &host_dashboard https://grafana.apikv.com/d/ops-portal
          runbook_url: &host_runbook https://github.com/lens077/kubernetes/blob/main/components/vmalert/README-host-metrics.md
      - alert: HostMetricsPipelineMissing
        expr: >-
          (group by(host_kind) (host:expected_info)
          unless on(host_kind) group by(host_kind) (time() - host:last_seen_timestamp_seconds < 300))
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 10m
        labels: {severity: warning, category: observability}
        annotations:
          summary: '{{ $labels.host_kind }} 主机指标整组中断'
          description: '连续 10 分钟没有该组任何主机的近期样本。cloud 检查 OTLP 公网入口和 token；kubernetes 检查 otel-node 到集群内 VM。逐台失联告警被这一条合并。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostMetricRulesStale
        expr: '(time() - host:rules_evaluation_timestamp_seconds > 180) or absent(host:rules_evaluation_timestamp_seconds)'
        for: 5m
        labels: {severity: warning, category: observability}
        annotations:
          summary: '共享主机指标规则停止更新'
          description: '规则评估时间超过 180 秒未推进或记录不存在，持续 5 分钟。检查 vmalert host-recording 组的 health、lastError 和 remoteWrite；不要逐台重启采集器。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostMetricSignalMissing
        expr: >-
          (
            (label_replace(host:expected_info, "signal", "cpu", "", "")
             or label_replace(host:expected_info, "signal", "memory", "", "")
             or label_replace(host:expected_info, "signal", "filesystem", "", "")
             or label_replace(host:expected_info, "signal", "network", "", ""))
            unless on(host,host_kind,signal)
            (host:signal_present == 1 and (time() - timestamp(host:signal_present) < 180))
          )
          and on(host,host_kind) (time() - host:last_seen_timestamp_seconds < 180)
          and on(host,host_kind) host:expected_info
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 10m
        labels: {severity: warning, category: observability}
        annotations:
          summary: '主机 {{ $labels.host }} 缺少 {{ $labels.signal }} 指标'
          description: '主机仍上报但某类必要指标缺失；检查对应 scraper、标签和 host-recording 的 health。缺失不是零使用率。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostRecordingEvaluationErrors
        expr: 'sum by(recording) (increase(vmalert_recording_rules_errors_total{group="host-recording"}[5m])) > 0'
        for: 5m
        labels: {severity: warning, category: observability}
        annotations:
          summary: '共享主机记录 {{ $labels.recording }} 持续求值失败'
          description: '全局规则时钟正常不代表每条记录都成功。检查 vmalert 对应 recording 的 lastError；消费端会拒绝超过 180 秒的旧记录。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostMemoryHigh
        expr: >-
          (host:memory_used_ratio > 0.9) and (time() - timestamp(host:memory_used_ratio) < 180)
          and on(host,host_kind) (host:signal_present{signal="memory"} == 1 and (time() - timestamp(host:signal_present{signal="memory"}) < 180))
          and on(host,host_kind) host:expected_info
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 15m
        labels: {severity: warning, category: host}
        annotations:
          summary: '主机 {{ $labels.host }} 内存使用 {{ $value | humanizePercentage }}'
          description: 'OTel used 状态持续 15 分钟超过 90%，不是 MemAvailable 口径。检查进程 RSS、容器用量和 OOM 日志。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostCPUSaturated
        expr: >-
          (host:cpu_busy_ratio > 0.9) and (time() - timestamp(host:cpu_busy_ratio) < 180)
          and on(host,host_kind) (host:signal_present{signal="cpu"} == 1 and (time() - timestamp(host:signal_present{signal="cpu"}) < 180))
          and on(host,host_kind) host:expected_info
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 30m
        labels: {severity: warning, category: host}
        annotations:
          summary: '主机 {{ $labels.host }} CPU 忙碌率 {{ $value | humanizePercentage }}'
          description: '持续 30 分钟超过 90%，不含 idle/wait。先查 top；I/O 等待另看 host:cpu_iowait_ratio，不把等待当成 CPU 执行。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostDiskFilling
        expr: >-
          (host:filesystem_used_ratio > 0.85)
          and on(host,host_kind) host:expected_info{disk_alert_owner="vmalert"}
          and (time() - timestamp(host:filesystem_used_ratio) < 180)
          and on(host,host_kind) (host:signal_present{signal="filesystem"} == 1 and (time() - timestamp(host:signal_present{signal="filesystem"}) < 180))
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 15m
        labels: {severity: warning, category: host}
        annotations:
          summary: '主机 {{ $labels.host }} 磁盘 {{ $labels.mountpoint }} 已用 {{ $value | humanizePercentage }}'
          description: 'used/(used+free) 持续 15 分钟超过 85%。仅覆盖未交给 host-watchdog 的主机；检查 df 与目录增长来源。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook
      - alert: HostDiskAlmostFull
        expr: >-
          (host:filesystem_used_ratio > 0.95)
          and on(host,host_kind) host:expected_info{disk_alert_owner="vmalert"}
          and (time() - timestamp(host:filesystem_used_ratio) < 180)
          and on(host,host_kind) (host:signal_present{signal="filesystem"} == 1 and (time() - timestamp(host:signal_present{signal="filesystem"}) < 180))
          and on() (time() - host:rules_evaluation_timestamp_seconds < 180)
        for: 5m
        labels: {severity: critical, category: host}
        annotations:
          summary: '主机 {{ $labels.host }} 磁盘 {{ $labels.mountpoint }} 即将写满'
          description: '持续 5 分钟超过 95%。先确认可用写入空间，再清理已确认可删除的日志或镜像；不自动删除业务数据。'
          dashboard: *host_dashboard
          runbook_url: *host_runbook

  # ---- 采集代理自身（2026-09-29 contrib 升级时新增）----
  # 数据来自代理自己的 otelcol_* 指标（127.0.0.1:18888 → prometheus/self → 与主机指标同一出口）。
  # 出口整体断掉时这些指标也发不出来，那种情况由上面的 HostMetricsMissing / HostMetricsPipelineMissing 报；
  # 这一组只抓「指标还在、日志出了问题」的半故障。
  - name: cloud-hosts-telemetry
    interval: 1m
    rules:
      - alert: CloudHostLogExportFailing
        # 永久错误（4xx，如请求体被 WAF 拦成 403、单条超限 413）不重试，直接丢弃，只有这个计数能看到。
        expr: 'sum by (host_name) (increase(otelcol_exporter_send_failed_log_records_total{host_group="cloud"}[15m])) > 0'
        for: 5m
        labels: { severity: warning, category: observability }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 日志发送失败，15 分钟内丢弃 {{ $value | humanize }} 条'
          description: ssh 后 journalctl -u otelcol -n 50 看具体状态码。403 且入口在 node1 Traefik 时先查 SafeLine/CrowdSec 是否拦了 otlp-dev.apikv.com；401 是 token 被轮换，重跑 make host-otel。

      - alert: CloudHostTelemetryBacklog
        # 落盘队列（容量 5000 个请求，约十几个小时）持续积压：发送跟不上产生，或出口时好时坏。
        expr: >-
          max by (host_name) (
            otelcol_exporter_queue_size{host_group="cloud"} / otelcol_exporter_queue_capacity{host_group="cloud"}
          ) > 0.2
        for: 15m
        labels: { severity: warning, category: observability }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 遥测发送队列积压 {{ $value | humanizePercentage }}'
          description: 队列满了以后新数据会被拒收。看 journalctl -u otelcol 里的重试日志与 otlp-dev.apikv.com 的可用性；积压在 /var/lib/otelcol。

      - alert: CloudHostJournaldStalled
        # 每台主机每小时至少有 cron、sshd 等几十上百行 journal；1 小时一行都没收到，说明 journald 读取卡住
        # （journalctl 子进程被杀、cursor 损坏等），而主机指标还在（否则由失联规则报）。
        expr: >-
          sum by (host_name) (increase(otelcol_receiver_accepted_log_records_total{host_group="cloud",receiver="journald"}[1h])) == 0
          and on (host_name) group by (host_name) (system_memory_utilization_ratio{host_group="cloud"})
        for: 15m
        labels: { severity: warning, category: observability }
        annotations:
          summary: '云主机 {{ $labels.host_name }} 1 小时没有采到 journald 日志'
          description: systemctl restart otelcol 通常即可恢复；仍不行就删 /var/lib/otelcol/receiver_journald_* 后重启（会从当前位置重新开始，中间的日志不补）。
