# VPA 策略(2026-09-23 拍板, k1/k2/k3 三节点):
#   Recommender 开 = 只算建议; Admission webhook 保留但不作为自动调节手段(所有 VPA updateMode=Off,
#   webhook 无建议可注入); Updater 关 = 永远不主动驱逐 Pod 去套建议。
#   改 requests 只走「kubectl describe vpa 看 Target/Lower/Upper → 人工确认 → 改 Deployment」。
#   要重开 updater 必须先把对应 VPA 改成 Auto/Recreate 并接受驱逐, 不要只翻这一个开关。
admissionController:
  enabled: true
  replicas: 2
  certGen:
    enabled: false
  certManager:
    enabled: true
    issuerRef:
      name: global-ca-issuer
      kind: ClusterIssuer
      group: cert-manager.io
  mutatingWebhookConfiguration:
    failurePolicy: Ignore
updater:
  enabled: false                 # 见顶部策略; 2026-09-22 首装时曾为 true, 09-23 关闭
  replicas: 1

recommender:
  enabled: true
  replicas: 1                    # recommender 非数据面，三节点集群仍只需一个副本
  # 上游默认 25m/250Mi 会把低负载 Go 服务的推荐值全部顶成同一个地板，伪装成测量结果。
  # 10m/32Mi 来自当前集群低负载组件实测；具体安全下限仍由各工作负载在压测后决定。
  extraArgs:
    - --pod-recommendation-min-cpu-millicores=10
    - --pod-recommendation-min-memory-mb=32
  podDisruptionBudget:
    enabled: false               # 单副本下 PDB(minAvailable:1) 会挡住节点排空,
                                 # 与 kured 的自动重启窗口直接打架
  resources:
    requests:
      cpu: 50m
      memory: 200Mi              # recommender 在内存里为每个容器建直方图模型, Pod 越多越涨
    limits:
      memory: 500Mi
