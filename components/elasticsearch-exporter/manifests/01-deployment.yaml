apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: elasticsearch
  labels:
    app: elasticsearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
    spec:
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
          # exporter 1.7.0 没有独立的 --es.username/--es.password 参数，认证走 URI userinfo。
          # K8s 会展开 args 里的 $(ES_PASSWORD)，密码来自 ES 自己的 Secret，不落仓库。
          args:
            - --es.uri=http://elastic:$(ES_PASSWORD)@elasticsearch.elasticsearch.svc:9200
            - --es.all
            - --es.indices
            - --es.clusterinfo.interval=1m
            - --web.listen-address=:9114
          env:
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-auth
                  key: password-file
          ports:
            - {containerPort: 9114, name: metrics, protocol: TCP}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter
  namespace: elasticsearch
  labels:
    app: elasticsearch-exporter
spec:
  type: ClusterIP
  selector:
    app: elasticsearch-exporter
  ports:
    - {name: metrics, port: 9114, targetPort: metrics, protocol: TCP}
