# CEL (ValidatingPolicy) migration of legacy ClusterPolicy/disallow-latest-tag.
# Keeps Audit semantics: violations are reported, never blocked.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  evaluation:
    mode: Kubernetes
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validationActions: [Audit]
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - replicasets
        - jobs
        - cronjobs
        - replicationcontrollers
  variables:
    - name: allImages
      expression: >-
        (object.spec.?containers.orValue([]) + object.spec.?initContainers.orValue([]) +
         object.spec.?ephemeralContainers.orValue([])).map(c, c.image)
  validations:
    - message: "Container images must not use the ':latest' tag"
      expression: >-
        variables.allImages.map(image,
          !(image.endsWith(':latest') || !image.contains(':'))).all(e, e)

---
# CEL (ValidatingPolicy) migration of legacy ClusterPolicy/require-requests-limits.
# Original pattern required cpu+memory requests and memory limit (Audit).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
spec:
  evaluation:
    mode: Kubernetes
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validationActions: [Audit]
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - replicasets
        - jobs
        - cronjobs
        - replicationcontrollers
  variables:
    - name: allContainers
      expression: >-
        (object.spec.?containers.orValue([]) + object.spec.?initContainers.orValue([]) +
         object.spec.?ephemeralContainers.orValue([]))
  validations:
    - message: "containers must define CPU/memory requests and limits"
      expression: >-
        variables.allContainers.all(c,
          has(c.resources) && has(c.resources.requests) &&
          has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
          has(c.resources.limits) && has(c.resources.limits.memory))
