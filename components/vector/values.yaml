# Vector Agent —— 2026-08-20 选型定稿 §8（替 fluent-bit；VRL PII 脱敏可单测）
# 双写期与 fluent-bit 并行：Vector→VictoriaLogs，fluent-bit→Loki，互不影响
role: Agent
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 250m, memory: 256Mi }
persistence:
  hostPath:
    enabled: true
    path: /var/lib/vector      # kubernetes_logs checkpoint，重启续读
customConfig:
  data_dir: /var/lib/vector
  api: { enabled: true, address: 127.0.0.1:8686 }
  sources:
    kubernetes:
      type: kubernetes_logs
      auto_partial_merge: true
      # 2026-08-21 加固(VM 官方 log-collectors-benchmark 与本集群 08-20 实测互证):
      # ① 文件发现间隔默认 60s → 新 Pod 头 60s 日志静默丢失, 收紧到 10s(与 Fluent Bit 默认对齐)
      # ② read_from 由 end 改回 beginning: end 会让「发现晚于首行」的新文件永远丢头几行;
      #    当初设 end 只为部署首日不回灌历史, 现 checkpoint 已在 hostPath 落盘,
      #    旧文件按 checkpoint 续读不会重灌, beginning 才兜得住短命 Pod 的完整日志
      glob_minimum_cooldown_ms: 10000
      read_from: beginning
      max_line_bytes: 32768
  transforms:
    pii_redact:
      type: remap
      inputs: [kubernetes]
      source: |
        .message = replace(to_string!(.message), r'\b1[3-9]\d{9}\b', "[PHONE_REDACTED]")
        .message = replace(.message, r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', "[EMAIL_REDACTED]")
  sinks:
    victorialogs:
      type: http
      inputs: [pii_redact]
      # 2026-08-24: 容器日志改推 node3(Pigsty)的 VictoriaLogs, 经 node1 的 Pangolin 公网入口。
      #
      # 为什么单独改这里而不是只切 otel collector: collector 只承载**应用侧 OTLP 日志**,
      # 容器日志走的是 vector/fluent-bit 这条 DaemonSet 通路, 不经过 collector。
      # 只切 collector 的话日志大头仍然落在内网, 与"把观测负载挪出内网"的目的不符。
      #
      # 切回本地: 换回下面注释掉的那行集群内地址。
      # 集群内: http://vl-victoria-logs-single-server.logging.svc.cluster.local:9428/insert/jsonline?...
      uri: "https://node3-logs.apikv.com/insert/jsonline?_stream_fields=kubernetes.pod_namespace,kubernetes.pod_node_name,kubernetes.pod_name,kubernetes.container_name&_msg_field=message&_time_field=timestamp"
      compression: gzip
      encoding: { codec: json }
      framing: { method: newline_delimited }
      healthcheck: { enabled: false }
