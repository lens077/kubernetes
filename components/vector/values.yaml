# Vector Agent —— 2026-08-20 选型定稿 §8（替 fluent-bit；VRL PII 脱敏可单测）
# 双写期与 fluent-bit 并行：Vector→VictoriaLogs，fluent-bit→Loki，互不影响
role: Agent
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: vector-security-metrics
      namespace: logging
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vector
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: opentelemetry
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: otel
                  app.kubernetes.io/name: opentelemetry-collector
          ports:
            - port: 9598
              protocol: TCP
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 250m, memory: 256Mi }
persistence:
  hostPath:
    enabled: true
    path: /var/lib/vector      # kubernetes_logs checkpoint，重启续读
customConfig:
  data_dir: /var/lib/vector
  api: { enabled: true, address: 127.0.0.1:8686 }
  sources:
    kubernetes:
      type: kubernetes_logs
      auto_partial_merge: true
      # 2026-08-21 加固(VM 官方 log-collectors-benchmark 与本集群 08-20 实测互证):
      # ① 文件发现间隔默认 60s → 新 Pod 头 60s 日志静默丢失, 收紧到 10s(与 Fluent Bit 默认对齐)
      # ② read_from 由 end 改回 beginning: end 会让「发现晚于首行」的新文件永远丢头几行;
      #    当初设 end 只为部署首日不回灌历史, 现 checkpoint 已在 hostPath 落盘,
      #    旧文件按 checkpoint 续读不会重灌, beginning 才兜得住短命 Pod 的完整日志
      glob_minimum_cooldown_ms: 10000
      read_from: beginning
      max_line_bytes: 32768
  transforms:
    pii_redact:
      type: remap
      inputs: [kubernetes]
      source: |
        .message = replace(to_string!(.message), r'\b1[3-9]\d{9}\b', "[PHONE_REDACTED]")
        .message = replace(.message, r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', "[EMAIL_REDACTED]")
    tetragon_security_classify:
      type: remap
      inputs: [pii_redact]
      source: |
        .security_event = null
        if .kubernetes.pod_namespace == "tetragon" && .kubernetes.container_name == "export-stdout" {
          event = parse_json(.message) ?? {}
          if exists(event.process_kprobe) && event.process_kprobe.policy_name == "ecommerce-service-account-token-access" {
            .security_event = "token_access"
          } else if exists(event.process_exec) {
            namespace = to_string(event.process_exec.process.pod.namespace) ?? ""
            binary = to_string(event.process_exec.process.binary) ?? ""
            suspicious = ["/bin/bash", "/bin/sh", "/usr/bin/bash", "/usr/bin/curl", "/usr/bin/wget", "/usr/bin/nc", "/usr/bin/ncat", "/usr/bin/socat"]
            if namespace == "ecommerce" && includes(suspicious, binary) {
              .security_event = "suspicious_exec"
            }
          }
        }
    tetragon_security_events:
      type: filter
      inputs: [tetragon_security_classify]
      condition: is_string(.security_event)
    tetragon_security_metrics:
      type: log_to_metric
      inputs: [tetragon_security_events]
      metrics:
        - type: counter
          field: security_event
          name: tetragon_security_events_total
          namespace: ecommerce
          increment_by_value: false
          tags:
            event_type: '{{ "{{ security_event }}" }}'
            node: '{{ "{{ kubernetes.pod_node_name }}" }}'
  sinks:
    security_metrics:
      type: prometheus_exporter
      inputs: [tetragon_security_metrics]
      address: 0.0.0.0:9598
    victorialogs:
      type: http
      inputs: [pii_redact]
      # 容器日志直写集群内 VictoriaLogs(不经 otel collector: collector 只承载应用侧 OTLP 日志与 K8s Event)。
      # 2026-08-24 曾改推 node3(Pigsty)的 VL 以把观测负载挪出内网; 2026-09-03 node3 退役, 切回集群内。
      # 流字段(_stream_fields)只放低基数的 namespace/node/pod/container —— 与 Pigsty 的 job,ins,ip 同一思路;
      # 高基数字段(request id、pid)进消息体, 不进流字段。
      uri: "http://vl-victoria-logs-single-server.logging.svc.cluster.local:9428/insert/jsonline?_stream_fields=kubernetes.pod_namespace,kubernetes.pod_node_name,kubernetes.pod_name,kubernetes.container_name&_msg_field=message&_time_field=timestamp"
      compression: gzip
      encoding: { codec: json }
      framing: { method: newline_delimited }
      healthcheck: { enabled: false }
