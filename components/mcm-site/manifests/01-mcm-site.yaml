---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RELEASE}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${RELEASE}
    app.kubernetes.io/part-of: sites
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ${RELEASE}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${RELEASE}
        app.kubernetes.io/part-of: sites
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ${RELEASE}
      containers:
        - name: nginx
          image: ${MCM_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /var/cache/nginx
              name: cache
            - mountPath: /var/run
              name: run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${RELEASE}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${RELEASE}
spec:
  selector:
    app.kubernetes.io/name: ${RELEASE}
  ports:
    - name: http
      port: 80
      targetPort: http
