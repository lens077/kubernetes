# 集群外依赖的凭据/CA: OpenBao/Vault k8s/${CLUSTER_NAME}/${ID} 下的全部键 → Secret external/${ID}
# (dataFrom.extract: KV 里有什么键, Secret 就有什么键; 契约 CRED_KEYS / CA_REF 只声明消费哪些)。
# 由 components/_external/apply.sh 对每个启用的 _external/<id> 渲染并 apply。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${ID}
  namespace: ${NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${ESO_STORE}
  target:
    name: ${ID}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/${CLUSTER_NAME}/${ID}
