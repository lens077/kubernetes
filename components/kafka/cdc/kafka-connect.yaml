# KafkaConnect 运行时（Kafka 4.3.0）。镜像是 pipeline 仓 Dockerfile.connect 的派生：
#   基础层 strimzi-connect-debezium:20260915（Strimzi build 产出，Debezium PostgreSQL 3.6.1）
#   + /opt/kafka/plugins/kafka-connect-elasticsearch（Confluent ES Sink, commit bf11247）
# 之所以不用 spec.build：完整镜像 ~2.8GiB 推 TCR 时跨仓 layer mount 反复超时；同仓派生只需上传插件层。
# 插件必须放 /opt/kafka/plugins/<dir>，Strimzi 只扫这个目录（/kafka/connect 下放了也看不见）。
# 凭据经 KubernetesSecretConfigProvider 引用（rbac.yaml 授 get），connector 清单里不出现明文。
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: my-connect-cluster
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.0
  replicas: 1
  image: ccr.ccs.tencentyun.com/sumery/strimzi-connect-debezium:20260915-es-sink-bf11247-v2
  bootstrapServers: my-cluster-kafka-bootstrap:9092
  groupId: my-connect-cluster
  configStorageTopic: my-connect-cluster-configs
  offsetStorageTopic: my-connect-cluster-offsets
  statusStorageTopic: my-connect-cluster-status
  config:
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
  jvmOptions:
    -Xms: 256m
    -Xmx: 768m
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 1Gi}
