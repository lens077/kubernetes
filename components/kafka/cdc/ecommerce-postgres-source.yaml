# Debezium PostgreSQL source：CNPG pg-main → k8s Kafka。
# 配置与 postgres-kafka-es-streaming-pipeline/deploy/docker-node3/connectors/postgres-source.json 逐字段对齐
# （原 node3 Docker Connect 已于 2026-09-15 下线，本清单是唯一正式版本）。
# slot / publication / topic 前缀统一为 ecommerce_cdc；删除事件走 tombstone，由 sink 的 behavior.on.null.values=DELETE 落地。
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: ecommerce-postgres-source
  namespace: kafka
  labels:
    strimzi.io/cluster: my-connect-cluster
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: pg-main-rw.postgresql.svc.cluster.local
    database.port: "5432"
    database.dbname: ecommerce
    database.user: ${secrets:kafka/cdc-postgres:username}
    database.password: ${secrets:kafka/cdc-postgres:password}
    database.sslmode: require
    plugin.name: pgoutput
    publication.name: ecommerce_cdc
    publication.autocreate.mode: disabled
    slot.name: ecommerce_cdc
    slot.drop.on.stop: "false"
    # 被监控表长期无写入时默认模式不推进 confirmed_flush_lsn，槽把整库 WAL 钉住
    # （2026-09-23 新集群回归：lag 150MB、pg_wal 417MB 且 max_slot_wal_keep_size=-1 无上限）。
    # connector_and_driver 让 pgjdbc 用 keepalive LSN 刷位点，不需要心跳表；heartbeat.interval.ms 单独无效。
    # 见 ecommerce 仓 context/project/ecommerce/events/experience/debezium-idle-slot-wal-retention.md
    lsn.flush.mode: connector_and_driver
    # 3.6.1 起 connector_and_driver 会把 heartbeat 自动设成 600000ms(dbz#1605): 位点只在心跳触发 offset commit
    # 后推进, 10 分钟窗口对观测和 WAL 回收都太粗。显式 60s; 心跳 topic __debezium-heartbeat.ecommerce_cdc。
    # 本 Kafka 无 authorization, 不存在经验文档里「加 heartbeat 前先开 ACL 否则 task FAILED」的前置。
    heartbeat.interval.ms: "60000"
    # 2026-09-23 事故与纠正(两次):
    #   白天: broker 滚动 → task 重启 → Debezium 报「Last recorded offset is no longer available」→ FAILED, connector 仍 RUNNING。
    #         当时把 snapshot.mode 改成 when_needed 让它自愈, 并把根因记成「offset 提交被滚动卡住」——**记错了**。
    #   晚上: 什么都没坏, 只重启 task 一次, 又重快照(spus topic +7)。查文档: lsn.flush.mode=connector_and_driver 让 pgjdbc
    #         keepalive 把槽推过无关 WAL, Kafka 里的 offset 结构性落后于槽, **每次重启都** offset_lsn < slot_lsn。
    #         initial → FAILED; when_needed → 每次重启全量重快照(表大了是灾难)。
    # 正解(Debezium ≥3.4, 文档明确与 connector_and_driver 配对): offset.mismatch.strategy=trust_greater_lsn —— 启动时取
    # offset 与槽 confirmed_flush 的较大者, 双向同步, 不重快照也不 FAILED。代价: offset 落后槽的那段(driver 推过的无关 WAL)
    # 被跳过; 监控表的事件不在其中(driver 只在无待提交事件时 flush), 见 experience 文档。
    # https://debezium.io/documentation/reference/stable/connectors/postgresql.html#postgresql-property-offset-mismatch-strategy
    snapshot.mode: initial
    offset.mismatch.strategy: trust_greater_lsn
    snapshot.locking.mode: none
    schema.include.list: orders,products
    table.include.list: orders.order_main,orders.order_item,orders.order_log,products.skus,products.spus,products.sale_detail,products.search_catalog
    topic.prefix: ecommerce_cdc
    decimal.handling.mode: double
    binary.handling.mode: base64
    time.precision.mode: connect
    tombstones.on.delete: "true"
    transforms: unwrap
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    transforms.unwrap.delete.tombstone.handling.mode: delete-to-tombstone
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
