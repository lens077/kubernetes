# Elasticsearch sink：k8s Kafka → k8s Elasticsearch（elasticsearch 命名空间，ClusterIP）。
# 与 pipeline 仓 connectors/elasticsearch-sink.json 对齐；写入目标是 7 个 alias（各自指向 <alias>_v1 write index），
# 索引模板 ecommerce-cdc-<alias> 由 components/elasticsearch 的初始化步骤创建（replicas=0，单节点）。
# DLQ 副本数显式为 1：单 broker 下默认值 3 会让 topic 创建失败。
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: ecommerce-elasticsearch-sink
  namespace: kafka
  labels:
    strimzi.io/cluster: my-connect-cluster
spec:
  class: io.confluent.connect.elasticsearch.ElasticsearchSinkConnector
  tasksMax: 1
  config:
    connection.url: http://elasticsearch.elasticsearch.svc.cluster.local:9200
    connection.username: ${secrets:kafka/cdc-elasticsearch:username}
    connection.password: ${secrets:kafka/cdc-elasticsearch:password}
    topics: ecommerce_cdc.orders.order_main,ecommerce_cdc.orders.order_item,ecommerce_cdc.orders.order_log,ecommerce_cdc.products.skus,ecommerce_cdc.products.spus,ecommerce_cdc.products.sale_detail,ecommerce_cdc.products.search_catalog
    external.resource.usage: ALIAS_INDEX
    topic.to.external.resource.mapping: ecommerce_cdc.orders.order_main:ecommerce_orders_order_main,ecommerce_cdc.orders.order_item:ecommerce_orders_order_item,ecommerce_cdc.orders.order_log:ecommerce_orders_order_log,ecommerce_cdc.products.skus:ecommerce_products_skus,ecommerce_cdc.products.spus:ecommerce_products_spus,ecommerce_cdc.products.sale_detail:ecommerce_products_sale_detail,ecommerce_cdc.products.search_catalog:ecommerce_catalog_products
    key.ignore: "false"
    use.autogenerated.ids: "false"
    schema.ignore: "true"
    write.method: INSERT
    behavior.on.null.values: DELETE
    behavior.on.malformed.documents: fail
    drop.invalid.message: "false"
    batch.size: "2000"
    bulk.size.bytes: "5242880"
    max.buffered.records: "10000"
    linger.ms: "1000"
    max.in.flight.requests: "1"
    max.retries: "10"
    retry.backoff.ms: "1000"
    flush.timeout.ms: "180000"
    errors.tolerance: none
    errors.log.enable: "true"
    errors.log.include.messages: "false"
    errors.deadletterqueue.topic.name: ecommerce_cdc.elasticsearch.dlq
    errors.deadletterqueue.topic.replication.factor: "1"
    errors.deadletterqueue.context.headers.enable: "true"
    transforms: extractKey
    transforms.extractKey.type: org.apache.kafka.connect.transforms.ExtractField$Key
    transforms.extractKey.field: id
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "false"
