# master：Dashboard(/login) + master 管理 API(/api/dashboard/*) + gRPC 8086（server/worker 连这里）。
# gorse-in-one/gorse-master 都只跑 master 角色（源码 cmd/gorse-in-one 只 m.Serve()）；
# RESTful 推荐 API 在 gorse-server，见 server.yaml。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gorse.name" . }}-master
  labels:
    {{- include "gorse.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gorse.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        {{- include "gorse.labels" . | nindent 8 }}
        app.kubernetes.io/component: master
    spec:
      initContainers:
        - name: render-config
          image: busybox:1.37
          command: [sh, -c]
{{- include "gorse.initContainer" . | nindent 10 }}
      containers:
        - name: gorse-master
          image: "{{ .Values.image.master }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GORSE_CACHE_STORE
              valueFrom: { secretKeyRef: { name: {{ .Values.storeSecret }}, key: cache-store } }
            - name: GORSE_DATA_STORE
              valueFrom: { secretKeyRef: { name: {{ .Values.storeSecret }}, key: data-store } }
            - name: GORSE_BLOB_URI
              value: /var/lib/gorse/blob
            - name: SSL_CERT_FILE
              value: /etc/gorse/ca/root/ca.crt
          ports:
            - { name: http, containerPort: 8088 }
            - { name: grpc, containerPort: 8086 }
          readinessProbe:
            httpGet: { path: /login, port: http }   # gorse 无 /api/health(404)；/login 恒 200（dashboard 登录页）
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 90   # 首启要建表/训练，60s 内探不动会被杀进 CrashLoop（实测踩过）
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.master | nindent 12 }}
          volumeMounts:
            - { name: config,  mountPath: /etc/gorse }
            - { name: varlib,  mountPath: /var/lib/gorse }
            - { name: ca-root, mountPath: /etc/gorse/ca/root, readOnly: true }
            - { name: ca-pg,   mountPath: /etc/gorse/ca/pg,   readOnly: true }
      volumes:
        - name: config-src
          configMap: { name: {{ include "gorse.name" . }} }
        - name: config
          emptyDir: {}
        - name: store-secret
          secret: { secretName: {{ .Values.storeSecret }} }
        - name: varlib
          emptyDir: {}   # vector.db(sqlite) + blob 可重建；真相在 data_store(CNPG)
        - name: ca-root
          secret: { secretName: {{ .Values.caSecrets.name }}, items: [{ key: {{ .Values.caSecrets.rootKey }}, path: ca.crt }] }
        - name: ca-pg
          secret: { secretName: {{ .Values.caSecrets.name }}, items: [{ key: {{ .Values.caSecrets.pgKey }}, path: ca.crt }] }
