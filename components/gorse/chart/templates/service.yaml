apiVersion: v1
kind: Service
metadata:
  name: {{ include "gorse.name" . }}
  labels:
    {{- include "gorse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "gorse.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 8086
      targetPort: grpc
