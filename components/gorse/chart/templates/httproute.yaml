{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gorse.name" . }}
  labels:
    {{- include "gorse.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentName }}
      namespace: {{ .Values.httpRoute.parentNamespace }}
      sectionName: {{ .Values.httpRoute.sectionName }}
  hostnames:
    - {{ .Values.hostname }}
    - {{ .Values.hostname | replace ".apikv.com" ".dev.test" }}   # Cilium 只挂载 listener 证书(*.dev.test)覆盖的 hostname（与 shop/blog 同款双名）
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "gorse.name" . }}
          port: 80   # Service 稳定端口; targetPort 指向 master 8088
{{- end }}
