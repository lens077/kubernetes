# 通过 Gateway API 暴露 Meilisearch(改 hostname/Gateway 名后 kubectl apply)
# HTTP -> HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meilisearch-redirect-route
  namespace: search
spec:
  parentRefs:
    - name: meilisearch-gateway
      sectionName: http
  hostnames:
    - "search.app.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
---
# HTTPS 业务路由 (443 -> 7700)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meilisearch-https-route
  namespace: search
spec:
  parentRefs:
    - name: meilisearch-gateway
      sectionName: https
  hostnames:
    - "search.app.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: meilisearch
          port: 7700
