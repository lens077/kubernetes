# 告警桥：Alertmanager 的唯一 receiver，Bugsink 的 webhook 目标；把两者都推到 ntfy，并把每条
# 告警以 JSON 行写 stdout（Vector → VictoriaLogs，job=alert-bridge）。
# 脚本由 install.sh 从 bridge.py 装进 ConfigMap；ntfy 凭据在 Secret alert-bridge-ntfy（不入库）。
---
apiVersion: v1
kind: Service
metadata:
  name: alert-bridge
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: alert-bridge
spec:
  selector:
    app.kubernetes.io/name: alert-bridge
  ports:
    - name: alertmanager     # Alertmanager webhook_configs.url → http://alert-bridge:9099/alerts
      port: 9099
      targetPort: 9099
    - name: bugsink          # Bugsink webhook → http://alert-bridge:9199/bugsink/<token>
      port: 9199
      targetPort: 9199
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bridge
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: alert-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-bridge
      annotations:
        # 脚本改了要滚动: install.sh 把 bridge.py 的 sha256 写进来
        bridge.sha256: "${BRIDGE_SHA256}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          # 只用标准库, 官方 alpine 镜像即可; 钉小版本线, 不用 latest
          image: docker.io/library/python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/bridge.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ALERTMANAGER_LISTEN
              value: "0.0.0.0:9099"
            - name: BUGSINK_BRIDGE_LISTEN
              value: "0.0.0.0:9199"
          envFrom:
            - secretRef:
                name: alert-bridge-ntfy     # NTFY_URL / NTFY_TOPIC / NTFY_TOKEN / BUGSINK_BRIDGE_TOKEN
          ports:
            - { name: alertmanager, containerPort: 9099 }
            - { name: bugsink, containerPort: 9199 }
          readinessProbe:
            httpGet: { path: /healthz, port: 9099 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 9099 }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: script
          configMap:
            name: alert-bridge-script
