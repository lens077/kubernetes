apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: purelb-pool
spec:
  # IP池范围
  blocks:
    - start: 192.168.3.103
      stop: 192.168.3.250
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-policy
spec:
  serviceSelector: {}
  nodeSelector: {}
  externalIPs: true
  interfaces:
    - enp0s5 # 你的机器的网卡设备
