---
# 云主机采集代理（otelcol-contrib）。只装一个进程、不开端口；不改 docker 日志驱动、host-watchdog、防火墙。

- name: prepare binary and token on controller
  run_once: true
  delegate_to: localhost
  become: false
  block:
    - name: verify otelcol-contrib binary checksum (make host-otel 负责从固定 digest 的镜像里取出)
      stat: { path: "{{ otelcol_binary }}", checksum_algorithm: sha256, get_mime: false }
      register: otelcol_bin
      failed_when: >-
        not otelcol_bin.stat.exists or otelcol_sha256 == '' or otelcol_bin.stat.checksum != otelcol_sha256

    - name: read OTLP public token from cluster secret
      shell: "set -o pipefail; {{ otlp_token_cmd }} | base64 -d"
      args: { executable: /bin/bash }
      register: otlp_token
      changed_when: false
      no_log: true
      failed_when: otlp_token.rc != 0 or (otlp_token.stdout | length) < 16

- name: detect docker
  stat: { path: /var/run/docker.sock, get_checksum: false, get_mime: false }
  register: docker_sock

- name: decide whether to collect container metrics/logs
  set_fact:
    otelcol_docker: "{{ docker_sock.stat.exists and docker_sock.stat.issock }}"

- name: otelcol system user
  user: { name: otelcol, system: true, shell: /usr/sbin/nologin, create_home: false, home: /nonexistent }

- name: config directory
  file: { path: /etc/otelcol, state: directory, owner: root, group: otelcol, mode: "0750" }

# validate 会检查 file_storage 目录是否存在；平时由 systemd 的 StateDirectory 创建，首次安装先建好
- name: state directory
  file: { path: "{{ otelcol_state_dir }}", state: directory, owner: otelcol, group: otelcol, mode: "0750" }

- name: install otelcol-contrib binary
  copy:
    src: "{{ otelcol_binary }}"
    dest: /usr/local/bin/otelcol-contrib
    owner: root
    group: root
    mode: "0755"
  notify: restart otelcol

- name: render collector config (validated by the binary itself)
  template:
    src: config.yaml.j2
    dest: /etc/otelcol/config.yaml
    owner: root
    group: otelcol
    mode: "0640"
    validate: /usr/local/bin/otelcol-contrib validate --config=%s
  notify: restart otelcol

- name: token env file
  copy:
    dest: /etc/otelcol/otelcol.env
    content: "OTLP_PUBLIC_TOKEN={{ otlp_token.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart otelcol

- name: systemd unit
  template: { src: otelcol.service.j2, dest: /etc/systemd/system/otelcol.service, owner: root, group: root, mode: "0644" }
  notify: restart otelcol

- name: enable otelcol
  systemd: { name: otelcol, enabled: true, state: started, daemon_reload: true }

- meta: flush_handlers

# core 发行版（2026-09-29 首版）换成 contrib 后，旧二进制不再被引用
- name: remove superseded otelcol core binary
  file: { path: /usr/local/bin/otelcol, state: absent }

# ---- 验收：进程在跑 ≠ 数据进库。指标、自身指标、日志都要在后端查到本机的数据 ----
- name: service stays active
  command: systemctl is-active otelcol
  register: otelcol_active
  changed_when: false
  retries: 6
  delay: 5
  until: otelcol_active.stdout == 'active'

# 只看当前进程（_PID）：重启时旧进程退出前的最后几行（关停时 flush 失败等）和新进程同一秒，按时间筛会误报
- name: no export/auth/permission errors since start
  shell: >-
    sleep 20; journalctl _PID="$(systemctl show otelcol -p MainPID --value)" --no-pager -o cat
    | grep -iE '401|403|unauthorized|forbidden|permanent error|failed to export|dropping|permission denied' | head -5
  register: otelcol_errors
  changed_when: false
  failed_when: otelcol_errors.stdout != ''

- name: host metrics visible in VictoriaMetrics
  delegate_to: localhost
  become: false
  shell: >-
    kubectl get --raw "/api/v1/namespaces/victoriametrics/services/vm-single-victoria-metrics-single-server:8428/proxy/api/v1/query?query=count(last_over_time(system_memory_utilization_ratio%7Bhost_name%3D%22{{ host_label }}%22%7D%5B2m%5D))"
    | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)'
  register: vm_series
  changed_when: false
  retries: 12
  delay: 10
  until: (vm_series.stdout | int) > 0

- name: collector self-metrics visible in VictoriaMetrics
  delegate_to: localhost
  become: false
  shell: >-
    kubectl get --raw "/api/v1/namespaces/victoriametrics/services/vm-single-victoria-metrics-single-server:8428/proxy/api/v1/query?query=count(last_over_time(%7B__name__%3D~%22otelcol_exporter_sent_.*%22%2Chost_name%3D%22{{ host_label }}%22%7D%5B3m%5D))"
    | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)'
  register: self_series
  changed_when: false
  retries: 12
  delay: 15
  until: (self_series.stdout | int) > 0

# journald 每台每小时都有几百行，5 分钟内一定能查到；查不到说明日志链路不通
- name: journald logs visible in VictoriaLogs
  delegate_to: localhost
  become: false
  shell: >-
    kubectl get --raw '/api/v1/namespaces/logging/services/vl-victoria-logs-single-server:9428/proxy/select/logsql/query?query=_time%3A10m%20host.name%3A%3D{{ host_label }}%20log.source%3A%3Djournald%20%7C%20stats%20count()%20n'
    | python3 -c 'import sys,json; l=sys.stdin.read().strip(); print(json.loads(l)["n"] if l else 0)'
  register: vl_journald
  changed_when: false
  retries: 20
  delay: 15
  until: (vl_journald.stdout | int) > 0

- name: container metrics visible in VictoriaMetrics (only when containers are running)
  when: otelcol_docker
  delegate_to: localhost
  become: false
  shell: >-
    running=$(ssh {{ inventory_hostname }} 'docker ps -q | wc -l');
    [ "$running" -eq 0 ] && { echo skip; exit 0; };
    kubectl get --raw "/api/v1/namespaces/victoriametrics/services/vm-single-victoria-metrics-single-server:8428/proxy/api/v1/query?query=count(count%20by%20(container_name)%20(last_over_time(%7B__name__%3D~%22container_.*%22%2Chost_name%3D%22{{ host_label }}%22%7D%5B3m%5D)))"
    | python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; n=int(r[0]['value'][1]) if r else 0; print('ok' if n >= int('$running') else f'{n}/$running')"
  register: vm_containers
  changed_when: false
  retries: 12
  delay: 15
  until: vm_containers.stdout in ['ok', 'skip']
