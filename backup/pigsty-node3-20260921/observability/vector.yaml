---
data_dir: /data/vector

api:
  enabled: true

sources:
  # vector internal metrics
  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 15

sinks:
  # expose metrics (internal + custom) to victoria metrics
  vmetrics:
    type: prometheus_exporter
    inputs: ["*_metrics"]
    address: 0.0.0.0:9598
    default_namespace: vector  # send logs to victoria logs receivers
  vlogs:
    type: http
    inputs: ["*_logs"]
    uri: http://10.10.21.172:9428/insert/jsonline
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    healthcheck:
      enabled: false
    request:
      headers:
        VL-Stream-Fields: job,ins,ip
        VL-Msg-Field: message
        VL-Time-Field: _time
        VL-Ignore-Fields: timestamp,file
        AccountID: "0"
        ProjectID: "0"
...
