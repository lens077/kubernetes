---
#==============================================================#
# File      :   prometheus.yml
# Ctime     :   2026-01-22
# Desc      :   VictoriaMetrics Configuration File
# Path      :   /infra/prometheus.yml
# License   :   Apache-2.0 @ https://pigsty.io/docs/about/license/
# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#
# VictoriaMetrics is fully compatible with Prometheus config
# https://docs.victoriametrics.com/single-server-victoriametrics/#how-to-scrape-prometheus-exporters-such-as-node-exporter
#--------------------------------------------------------------#

#--------------------------------------------------------------#
# Globals
#--------------------------------------------------------------#
global:
  scrape_interval: 10s
  scrape_timeout:  8s


#--------------------------------------------------------------#
# Targets Definition
#--------------------------------------------------------------#
# https://docs.victoriametrics.com/sd_configs/
scrape_configs:

  #--------------------------------------------------------------#
  # job: ping
  # blackbox exporter metrics
  #--------------------------------------------------------------#
  - job_name: ping
    metrics_path: /probe
    params: {module: [icmp]}
    file_sd_configs:
      - files: [ /infra/targets/ping/*.yml ]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  #--------------------------------------------------------------#
  # job: infra
  # targets: vmetrics | grafana | alertmanager | vlogs | nginx
  # labels: [ip, instance, type]
  # path: targets/infra/<ip>.yml
  #--------------------------------------------------------------#
  - job_name: infra
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/infra/*.yml ]

  #--------------------------------------------------------------#
  # job: node
  # node_exporter, haproxy, docker, vector
  # labels: [cls, ins, ip, instance]
  # path: targets/node/<ip>.yml
  #--------------------------------------------------------------#
  - job_name: node
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/node/*.yml ]

  #--------------------------------------------------------------#
  # job: docker
  # docker daemon
  # labels: [cls, ins, ip, instance]
  # path: targets/docker/<ip>.yml
  #--------------------------------------------------------------#
  - job_name: docker
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/docker/*.yml ]
    relabel_configs: # relabel docker metrics job to node
      - source_labels: [job]
        target_label: job
        replacement: 'node'

  #--------------------------------------------------------------#
  # job: etcd
  # labels: [cls, ins, ip, instance]
  # path: targets/etcd/<etcd_instance>.yml
  #--------------------------------------------------------------#
  - job_name: etcd
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/etcd/*.yml ]
    scheme: https
    tls_config:
      ca_file:   /etc/pki/ca.crt
      cert_file: /etc/pki/infra.crt
      key_file:  /etc/pki/infra.key

  #--------------------------------------------------------------#
  # job: minio
  # labels: [cls, ins, ip, instance]
  # path: targets/minio/<minio_instance>.yml
  #--------------------------------------------------------------#
  - job_name: minio
    metrics_path: /minio/metrics/v3
    file_sd_configs:
      - files: [ /infra/targets/minio/*.yml ]
    scheme: https
    # The V3 root also exposes cluster usage series with a bucket dimension.
    # Keep one static endpoint per instance while enforcing the intentional
    # no-per-bucket policy and avoiding bucket-cardinality growth.
    metric_relabel_configs:
      - source_labels: [ bucket ]
        regex: '.+'
        action: drop

    tls_config:
      ca_file:   /etc/pki/ca.crt
      cert_file: /etc/pki/infra.crt
      key_file:  /etc/pki/infra.key

  #--------------------------------------------------------------#
  # job: pgsql
  # pg_exporter | pgbouncer_exporter | patroni (if ssl disabled)
  # labels: [cls, ins, ip, instance]
  # path: targets/pgsql/<pg_instance>.yml
  #--------------------------------------------------------------#
  - job_name: pgsql
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/pgsql/*.yml ]


  #--------------------------------------------------------------#
  # job: pgrds
  # pg_exporter on local
  # labels: [cls, ins, ip, job]
  # path: targets/pgrds/<pg_cluster>.yml
  #--------------------------------------------------------------#
  - job_name: pgrds
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/pgrds/*.yml ]

  #--------------------------------------------------------------#
  # job: redis
  # multiple redis targets from redis_exporter @ target node
  # labels: [cls, ip, ins, instance]
  # path: targets/redis/<redis_node>.yml
  #--------------------------------------------------------------#
  - job_name: redis
    metrics_path: /scrape
    file_sd_configs:
      - files: [ /infra/targets/redis/*.yml ]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: ^redis://(.*):(\d+)$
        replacement: $1:$2
        target_label: instance
      - source_labels: [__param_target]
        regex: ^redis://(.*):(\d+)$
        replacement: $1
        target_label: ip
      # scrape redis_exporter on target node
      - source_labels: [__param_target]
        regex: ^redis://(.*):\d+$
        replacement: $1:9121
        target_label: __address__

  #--------------------------------------------------------------#
  # job: mysql
  # labels: [cls, ins, ip, instance]
  # path: targets/mysql/<mysql_instance>.yml
  #--------------------------------------------------------------#
  - job_name: mysql
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/mysql/*.yml ]

  #--------------------------------------------------------------#
  # job: kafka
  # JVM/broker/KRaft metrics via JMX agent (role label), plus cluster
  # protocol metadata and consumer lag via kafka_exporter (no role label)
  # labels: [cls, ins, ip, role, node_id, instance]
  # path: targets/kafka/<kafka_instance>.yml
  #--------------------------------------------------------------#
  - job_name: kafka
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/kafka/*.yml ]

  #--------------------------------------------------------------#
  # job: juice
  # juicefs metrics
  # labels: [cls, ins, ip, instance]
  # path: targets/juice/<ip>.yml
  #--------------------------------------------------------------#
  - job_name: juice
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/juice/*.yml ]


  # LyraPass/Casdoor 公网端点：blackbox_exporter HTTP/TLS 探针。
  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    file_sd_configs:
      - files: [ /infra/targets/blackbox-http/*.yml ]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
      - target_label: monitor
        replacement: lyrapass

  # LyraPass 依赖节点：node_exporter 与 cAdvisor。
  - job_name: lyrapass-exporter
    metrics_path: /metrics
    file_sd_configs:
      - files: [ /infra/targets/lyrapass-exporter/*.yml ]
    relabel_configs:
      - target_label: monitor
        replacement: lyrapass-exporter



...
