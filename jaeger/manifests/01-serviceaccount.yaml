# 原先由 Helm chart 创建,uninstall 时会被一并删除,所以这里重建一份。
# Jaeger all-in-one + badger 不访问 K8s API,不需要任何 Role/RoleBinding。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/component: all-in-one
# 保持与原 chart 一致(chart 显式设为 true,亦为 K8s 默认值),
# 迁移过程不引入无关变更。
automountServiceAccountToken: true
